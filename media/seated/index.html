<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* MicroEngine's "Socket" tokens (site/src/styles/tokens.css), fixed to the values each world uses. */
      :root {
        --paper: oklch(97.5% 0.006 85);
        --paper-ink: oklch(22% 0.012 260);
        --paper-ink-2: oklch(40% 0.014 260);
        --graphite: oklch(18% 0.01 260);
        --graphite-2: oklch(21.5% 0.012 260);
        --graphite-3: oklch(26% 0.014 260);
        --rule: oklch(34% 0.014 260);
        --ink: #f1eee9;
        --ink-2: oklch(80% 0.012 260);
        --ink-3: oklch(72% 0.012 260);
        --amber: #fbc044;
        --amber-on-paper: oklch(80% 0.15 78);
        --module-ink: oklch(21% 0.03 85);
        --family-graphics: oklch(78% 0.12 295);
        --family-physics: oklch(79% 0.12 50);
        --family-audio: oklch(78% 0.12 355);
        --family-input: oklch(79% 0.11 245);
        --family-platform: oklch(80% 0.1 195);
        --family-tools: oklch(82% 0.13 125);
        --font-display: 'Bricolage Grotesque', sans-serif;
        --font-body: 'IBM Plex Sans', sans-serif;
        --font-mono: 'IBM Plex Mono', monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="50" data-width="1920" data-height="1080">
      <!-- Scenes: one sub-composition each. Bar N of the score starts at 2 N seconds (SPEC.md). -->
      <div id="code" class="clip" data-composition-id="code" data-composition-src="compositions/code.html" data-start="0" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="worlds" class="clip" data-composition-id="worlds" data-composition-src="compositions/worlds.html" data-start="10" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="board" class="clip" data-composition-id="board" data-composition-src="compositions/board.html" data-start="20" data-duration="16" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="claim" class="clip" data-composition-id="claim" data-composition-src="compositions/claim.html" data-start="36" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="mark" class="clip" data-composition-id="mark" data-composition-src="compositions/mark.html" data-start="42" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>

      <!-- Score: a MicroEngine Song rendered by audio/Program.cs. -->
      <audio id="score" class="clip" src="assets/audio/score.wav" data-start="0" data-duration="50" data-track-index="2" data-volume="0.8"></audio>

      <!-- Effects: MicroEngine Synth sounds. Each lands one frame after its picture. -->
      <audio id="sfx-tick-02" class="clip" src="assets/audio/tick-b.wav" data-start="0.63" data-duration="0.04" data-track-index="3" data-volume="0.7"></audio>
      <audio id="sfx-tick-03" class="clip" src="assets/audio/tick-c.wav" data-start="0.93" data-duration="0.04" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-tick-04" class="clip" src="assets/audio/tick-a.wav" data-start="1.23" data-duration="0.04" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-tick-05" class="clip" src="assets/audio/tick-c.wav" data-start="1.53" data-duration="0.04" data-track-index="3" data-volume="0.7"></audio>
      <audio id="sfx-tick-06" class="clip" src="assets/audio/tick-b.wav" data-start="1.83" data-duration="0.04" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-tick-07" class="clip" src="assets/audio/tick-a.wav" data-start="2.13" data-duration="0.04" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-tick-08" class="clip" src="assets/audio/tick-b.wav" data-start="2.43" data-duration="0.04" data-track-index="3" data-volume="0.7"></audio>
      <audio id="sfx-tick-09" class="clip" src="assets/audio/tick-c.wav" data-start="2.73" data-duration="0.04" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-tick-10" class="clip" src="assets/audio/tick-a.wav" data-start="3.03" data-duration="0.04" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-resolve" class="clip" src="assets/audio/resolve.wav" data-start="4.03" data-duration="0.56" data-track-index="3" data-volume="0.8"></audio>
      <audio id="sfx-riser-dive" class="clip" src="assets/audio/riser.wav" data-start="8.25" data-duration="1.75" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-pullback" class="clip" src="assets/audio/pullback.wav" data-start="20.03" data-duration="0.8" data-track-index="5" data-volume="0.9"></audio>
      <audio id="sfx-seat-1" class="clip" src="assets/audio/seat-a.wav" data-start="26.03" data-duration="0.15" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx-seat-2" class="clip" src="assets/audio/seat-b.wav" data-start="27.03" data-duration="0.15" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx-seat-3" class="clip" src="assets/audio/seat-c.wav" data-start="28.03" data-duration="0.15" data-track-index="5" data-volume="1"></audio>
      <audio id="sfx-seat-4" class="clip" src="assets/audio/seat-a.wav" data-start="29.03" data-duration="0.15" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx-seat-5" class="clip" src="assets/audio/seat-b.wav" data-start="30.03" data-duration="0.15" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx-seat-6" class="clip" src="assets/audio/seat-c.wav" data-start="31.03" data-duration="0.15" data-track-index="5" data-volume="1"></audio>
      <audio id="sfx-lift" class="clip" src="assets/audio/lift.wav" data-start="32.03" data-duration="0.2" data-track-index="3" data-volume="0.9"></audio>
      <audio id="sfx-seat-swap" class="clip" src="assets/audio/seat-a.wav" data-start="33.03" data-duration="0.15" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx-riser-claim" class="clip" src="assets/audio/riser-long.wav" data-start="34" data-duration="2" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-riser-mark" class="clip" src="assets/audio/riser.wav" data-start="42.25" data-duration="1.75" data-track-index="3" data-volume="0.7"></audio>
      <audio id="sfx-impact" class="clip" src="assets/audio/impact.wav" data-start="44.03" data-duration="1.03" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
