<template>
  <style>
    @font-face { font-family: 'Bricolage Grotesque'; font-weight: 600; src: url('assets/fonts/bricolage-grotesque-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('assets/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }

    #root { position: absolute; inset: 0; overflow: hidden; background: var(--graphite); }

    /* The board: the mark's construction, widened. A kernel bar, seven walls, six sockets open at the bottom. */
    #board-rig { position: absolute; inset: 0; }
    #board-stem { position: absolute; left: 560px; top: 600px; width: 80px; height: 64px; background: var(--ink); transform-origin: 50% 100%; }
    #board-kernel { position: absolute; left: 160px; top: 660px; width: 1600px; height: 60px; background: var(--ink); transform-origin: 440px 50%; z-index: 30; }
    .board-wall { position: absolute; top: 718px; width: 40px; height: 282px; background: var(--ink); transform-origin: 50% 0%; }

    /* A module: its family's colour, its family's icon, a one-unit gap to the socket's walls and to the kernel. */
    .board-module { position: absolute; top: 740px; width: 180px; height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
    .board-module svg { width: 104px; height: 104px; fill: var(--module-ink); }
    .board-module svg .seat { opacity: 0.55; }
    .board-module span { font: 500 28px/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--module-ink); }
    #board-m-swap { background-image: repeating-linear-gradient(135deg, transparent 0 14px, oklch(21% 0.03 85 / 0.16) 14px 28px); }

    /* The game: real play, pulled back from full frame into a screen that stands on the kernel. */
    #board-screen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; outline: 14px solid var(--ink); z-index: 10; }
    #board-screen video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; image-rendering: pixelated; }

    .board-line { position: absolute; left: 1104px; top: 272px; width: 716px; font: 600 76px/1.08 var(--font-display); letter-spacing: -0.02em; color: var(--ink); }
  </style>

  <div id="root" data-composition-id="board" data-width="1920" data-height="1080">
    <div id="board-rig" data-layout-allow-overflow>
      <div id="board-stem"></div>
      <div class="board-wall" id="board-wall-0" style="left: 160px"></div>
      <div class="board-wall" id="board-wall-1" style="left: 420px"></div>
      <div class="board-wall" id="board-wall-2" style="left: 680px"></div>
      <div class="board-wall" id="board-wall-3" style="left: 940px"></div>
      <div class="board-wall" id="board-wall-4" style="left: 1200px"></div>
      <div class="board-wall" id="board-wall-5" style="left: 1460px"></div>
      <div class="board-wall" id="board-wall-6" style="left: 1720px"></div>

      <!-- Family icons: site/src/components/brand/geometry.mjs, board and module paths as they are. -->
      <div class="board-module" id="board-m-0" style="left: 220px; background: var(--family-graphics)">
        <svg viewBox="0 0 16 16"><path fill-rule="evenodd" d="M0 2H16V14H0Z M2 4V12H14V4Z" /><path class="seat" d="M3 11V9H6V6H9V8H13V11Z" /></svg><span>Graphics</span>
      </div>
      <div class="board-module" id="board-m-1" style="left: 480px; background: var(--family-physics)">
        <svg viewBox="0 0 16 16"><path d="M0 3H2V13H16V15H0Z" /><path class="seat" d="M6 4H12V10H6Z" /></svg><span>Physics</span>
      </div>
      <div class="board-module" id="board-m-2" style="left: 740px; background: var(--family-audio)">
        <svg viewBox="0 0 16 16"><path d="M0 8H4V14H0Z M12 6H16V14H12Z" /><path class="seat" d="M6 2H10V14H6Z" /></svg><span>Audio</span>
      </div>
      <div class="board-module" id="board-m-3" style="left: 1000px; background: var(--family-input)">
        <svg viewBox="0 0 16 16"><path d="M6 1H10V15H6V10H1V6H6Z" /><path class="seat" d="M11 6H15V10H11Z" /></svg><span>Input</span>
      </div>
      <div class="board-module" id="board-m-4" style="left: 1260px; background: var(--family-platform)">
        <svg viewBox="0 0 16 16"><path d="M0 11H5V13H11V11H16V15H0Z" /><path class="seat" d="M6 3H10V12H6Z" /></svg><span>Platform</span>
      </div>
      <div class="board-module" id="board-m-swap" style="left: 1260px; background-color: var(--family-platform)">
        <svg viewBox="0 0 16 16"><path d="M0 11H5V13H11V11H16V15H0Z" /><path class="seat" d="M6 3H10V12H6Z" /></svg><span>Platform</span>
      </div>
      <div class="board-module" id="board-m-5" style="left: 1520px; background: var(--family-tools)">
        <svg viewBox="0 0 16 16"><path d="M0 1H5V3H2V13H5V15H0Z M16 1H11V3H14V13H11V15H16Z" /><path class="seat" d="M4 5H12V11H4Z" /></svg><span>Tools</span>
      </div>

      <div id="board-kernel"></div>

      <div id="board-screen">
        <video id="board-play" class="clip" src="assets/footage/screen.mp4" muted playsinline data-start="0" data-duration="16" data-media-start="0.2" data-track-index="1"></video>
      </div>
    </div>

    <h2 class="board-line" id="board-line-1">Underneath,<br />a small kernel</h2>
    <h2 class="board-line" id="board-line-2">Every subsystem<br />is a socket</h2>
    <h2 class="board-line" id="board-line-3">Swap a module.<br />The game plays on.</h2>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const lineIn = (id, at) => tl.fromTo(id, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, at);
      const lineOut = (id, at) => tl.to(id, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, at);

      gsap.set(".board-line", { opacity: 0 });
      gsap.set(".board-module", { y: 400 });

      // 0-1.3 s: the game pulls back from the whole frame into a screen (880 x 495 at 160, 110).
      tl.fromTo("#board-screen", { x: 0, y: 0, scale: 1 }, { x: 160, y: 110, scale: 880 / 1920, duration: 1.3, ease: "power3.inOut" }, 0);

      // 1.1-2.9 s: the stem, the kernel bar and the walls of its sockets draw.
      tl.fromTo("#board-stem", { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power3.out" }, 1.1);
      tl.fromTo("#board-kernel", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 1.25);
      tl.fromTo(".board-wall", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 2.0);
      lineIn("#board-line-1", 2.2);
      lineOut("#board-line-1", 5.6);

      // 6-11 s: six modules seat, each landing exactly on a downbeat or the third beat of its bar.
      lineIn("#board-line-2", 5.85);
      const seat = (id, at) => {
        tl.fromTo(id, { y: 400 }, { y: 0, duration: 0.3, ease: "power2.in" }, at - 0.3);
        // The board takes the hit: a 6 px recoil that settles within the beat.
        tl.fromTo("#board-rig", { y: -6 }, { y: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, at);
      };
      ["#board-m-0", "#board-m-2", "#board-m-4", "#board-m-1", "#board-m-3", "#board-m-5"].forEach((id, i) => seat(id, 6 + i));
      lineOut("#board-line-2", 11.6);

      // 12-13 s: one module drops out and another of its family seats. The game on the screen never stops.
      lineIn("#board-line-3", 11.85);
      tl.to("#board-m-4", { y: 400, duration: 0.4, ease: "power2.in" }, 12);
      seat("#board-m-swap", 13);
      lineOut("#board-line-3", 15.1);

      // 15.3-16 s: the kernel bar grows until it is the next scene's paper.
      tl.to("#board-kernel", { scaleY: 44, backgroundColor: "#f8f6f2", duration: 0.68, ease: "power3.in" }, 15.3);

      window.__timelines["board"] = tl;
    })();
  </script>
</template>
