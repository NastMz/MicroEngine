<template>
  <style>
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('assets/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }

    #root { position: absolute; inset: 0; overflow: hidden; background: var(--graphite); }

    /* The lockup, in the proportions of assets/brand/lockup-dark.svg (viewBox 0 -75 701 94) at 1100 px wide:
       the mark is 88 x 66 units at (0, -66), the wordmark starts at x 114, one unit is 1.5692 px. */
    #mark-cam { position: absolute; left: 410px; top: 430px; width: 1100px; height: 148px; transform-origin: 69px 66px; }
    #mark-glyph { position: absolute; left: 0; top: 14.12px; width: 138.09px; height: 103.57px; overflow: visible; }
    #mark-word { position: absolute; left: 178.89px; top: 0; width: 921.11px; height: 147.5px; }
    #mark-word img { display: block; width: 100%; height: 100%; }
    #mark-line { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font: 400 44px/1.2 var(--font-body); color: var(--ink-2); }
    .mark-w { display: inline-block; margin: 0 0.13em; }
  </style>

  <div id="root" data-composition-id="mark" data-width="1920" data-height="1080">
    <div id="mark-cam" data-layout-allow-overflow data-hold>
      <!-- The mark: the board and its module, from site/src/components/brand/geometry.mjs. -->
      <svg id="mark-glyph" viewBox="0 2 16 12">
        <path id="mark-board" fill="#f1eee9" d="M0 2H16V14H14V5H9V14H7V5H2V14H0Z" />
        <path id="mark-module" fill="#fbc044" d="M10 6H13V14H10Z" />
      </svg>
      <div id="mark-word"><img src="assets/brand/wordmark-dark.svg" alt="MicroEngine" /></div>
    </div>
    <!-- From the mark's construction notes: the left socket stays empty. -->
    <p id="mark-line"><span class="mark-w">There</span><span class="mark-w">is</span><span class="mark-w">always</span><span class="mark-w">room</span><span class="mark-w">for</span><span class="mark-w">another</span><span class="mark-w">module</span></p>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // The camera starts on the mark alone, 4.6 times its lockup size and centred in the frame.
      const close = { scale: 4.6, x: 481, y: 34 };
      gsap.set("#mark-cam", close);
      gsap.set("#mark-word", { clipPath: "inset(0% 100% 0% 0%)" });
      gsap.set(".mark-w", { opacity: 0 });

      // 0.3-1.5 s: the board draws, left to right: the kernel and two empty sockets.
      tl.fromTo("#mark-board", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.2, ease: "power2.inOut" }, 0.3);

      // 2.0 s (bar 22): the module seats from below, landing on the downbeat. The one heavy hit of the film.
      tl.fromTo("#mark-module", { y: 34 }, { y: 0, duration: 0.3, ease: "power3.in" }, 1.7);
      tl.fromTo("#mark-cam", { y: close.y - 16 }, { y: close.y, duration: 0.5, ease: "elastic.out(1, 0.55)", immediateRender: false }, 2.0);

      // 2.7-3.6 s: the camera pulls back to the lockup while the wordmark wipes in beside the mark.
      tl.to("#mark-cam", { scale: 1, x: 0, y: 0, duration: 0.9, ease: "power3.inOut" }, 2.7);
      tl.to("#mark-word", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.out" }, 3.15);

      // 4.3 s: the last line, word by word, then everything holds.
      tl.fromTo(".mark-w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.07 }, 4.3);

      window.__timelines["mark"] = tl;
    })();
  </script>
</template>
