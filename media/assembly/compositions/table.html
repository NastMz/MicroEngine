<template>
  <style>
    @font-face { font-family: 'Bricolage Grotesque'; font-weight: 600; src: url('assets/fonts/bricolage-grotesque-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('assets/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }

    #root { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }

    /* The assembly table, seen like an exploded drawing: almost no perspective, so parallel edges stay parallel.
       The camera is four nested groups: dolly (scale) > tilt > yaw > pivot. */
    #t-stage { position: absolute; inset: 0; perspective: 5200px; perspective-origin: 50% 50%; }
    #t-dolly, #t-tilt, #t-yaw, #t-pivot, .t-box, .t-guide { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
    #t-dolly { left: 960px; top: 636px; }
    .t-face { position: absolute; backface-visibility: hidden; }
    /* The table top, with the registration marks every piece is placed against. */
    #t-table { position: absolute; left: -1300px; top: -1300px; width: 2600px; height: 2600px; background: var(--table); }
    #t-table::before { content: ''; position: absolute; inset: 500px; border: 3px solid var(--mark); }
    #t-table::after { content: ''; position: absolute; left: 1298px; top: 380px; width: 3px; height: 1840px; background: var(--mark); box-shadow: none; }
    #t-cross { position: absolute; left: 380px; top: 1298px; width: 1840px; height: 3px; background: var(--mark); }
    /* A guide: the dashed axis a piece travels along between where it floats and where it docks. */
    .t-guide { border-top: 4px dashed var(--guide); height: 0; }

    /* A piece's face: its family's icon (site/src/components/brand/geometry.mjs), in the board's paper. */
    .t-front { display: flex; align-items: center; justify-content: center; }
    .t-front svg { width: 84px; height: 84px; fill: var(--ink); }
    .t-front svg .seat { opacity: 0.55; }
    .t-own .t-face { box-shadow: inset 0 0 0 5px var(--paper-ink); }
    .t-band { position: absolute; left: 5px; right: 5px; bottom: 5px; height: 34%; }

    /* What a configuration is for: a plane above it. Its face is laid out flat here and placed by the script. */
    #t-plane-face { position: absolute; left: 0; top: 0; width: 640px; height: 360px; overflow: hidden; background: var(--graphite-2); backface-visibility: hidden; }
    #t-plane-face video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    #t-yours { position: absolute; inset: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; }
    #t-yours::before { content: ''; position: absolute; inset: 22px; border: 5px dashed var(--paper-ink); }
    #t-yours span { font: 500 44px/1 var(--font-mono); letter-spacing: 0.08em; color: var(--paper-ink); }

    .t-line { position: absolute; left: 120px; top: 92px; font: 600 88px/1.05 var(--font-display); letter-spacing: -0.02em; color: var(--paper-ink); white-space: nowrap; }
  </style>

  <div id="root" data-composition-id="table" data-width="1920" data-height="1080"
    style="--table: #ece8e1; --mark: #cfc9bf; --guide: #8b8a86; --kernel: #171b20;">
    <div id="t-stage" data-layout-allow-overflow>
      <div id="t-dolly"><div id="t-tilt"><div id="t-yaw"><div id="t-pivot">
        <div id="t-table"><div id="t-cross"></div></div>
        <div id="t-plane-face">
          <!-- Real play, captured from the demos' scripted runs: two different games, never one turning into the other. -->
          <video id="t-play-1" class="clip" src="assets/footage/screen.mp4" muted playsinline data-start="11.2" data-duration="8.4" data-media-start="0.2" data-track-index="1"></video>
          <video id="t-play-2" class="clip" src="assets/footage/tour.mp4" muted playsinline data-start="25.6" data-duration="8.4" data-media-start="0.2" data-track-index="1"></video>
          <div id="t-yours"><span>YOUR GAME</span></div>
        </div>
      </div></div></div></div>
    </div>

    <h2 class="t-line" id="t-line-1">One kernel</h2>
    <h2 class="t-line" id="t-line-2">Pieces that connect to it</h2>
    <h2 class="t-line" id="t-line-3">Assembled for one game</h2>
    <h2 class="t-line" id="t-line-4">Taken apart</h2>
    <h2 class="t-line" id="t-line-5">Reassembled for another</h2>
    <h2 class="t-line" id="t-line-6">With pieces of your own</h2>
  </div>

  <script>
    (() => {
      const world = document.querySelector("#t-pivot");
      // Flat shading, three tones a colour: front, top (lighter) and side (darker). No gradients, no shadows.
      const shade = c => ({ front: c, top: `color-mix(in oklab, ${c} 80%, white)`, side: `color-mix(in oklab, ${c} 80%, black)` });
      const INK = { front: "#171b20", top: "#3a4048", side: "#0c0e11" };
      const PAPER = { front: "#fbfaf7", top: "#ffffff", side: "#e2ded6" };
      const NEUTRAL = shade("oklch(62% 0.014 260)");
      // The site's family colours on paper (site/src/styles/tokens.css, light theme).
      const HUE = { graphics: "oklch(48% 0.15 295)", physics: "oklch(50% 0.13 45)", audio: "oklch(49% 0.15 355)",
        input: "oklch(48% 0.12 245)", platform: "oklch(48% 0.08 195)", tools: "oklch(47% 0.1 125)" };
      const ICON = {
        graphics: '<path fill-rule="evenodd" d="M0 2H16V14H0Z M2 4V12H14V4Z"/><path class="seat" d="M3 11V9H6V6H9V8H13V11Z"/>',
        physics: '<path d="M0 3H2V13H16V15H0Z"/><path class="seat" d="M6 4H12V10H6Z"/>',
        audio: '<path d="M0 8H4V14H0Z M12 6H16V14H12Z"/><path class="seat" d="M6 2H10V14H6Z"/>',
        input: '<path d="M6 1H10V15H6V10H1V6H6Z"/><path class="seat" d="M11 6H15V10H11Z"/>',
        platform: '<path d="M0 11H5V13H11V11H16V15H0Z"/><path class="seat" d="M6 3H10V12H6Z"/>',
        tools: '<path d="M0 1H5V3H2V13H5V15H0Z M16 1H11V3H14V13H11V15H16Z"/><path class="seat" d="M4 5H12V11H4Z"/>',
      };

      // A box of six flat faces, centred on its own origin; placed with gsap so transforms never conflict.
      const box = (id, w, h, d, colors, front, own) => {
        const el = document.createElement("div");
        el.className = "t-box" + (own ? " t-own" : "");
        el.id = id;
        const face = (fw, fh, transform, color, html) => {
          const f = document.createElement("div");
          f.className = "t-face" + (html ? " t-front" : "");
          f.style.cssText = `width:${fw}px;height:${fh}px;left:${-fw / 2}px;top:${-fh / 2}px;transform:${transform};background:${color};`;
          if (html) f.innerHTML = html;
          el.append(f);
        };
        face(w, h, `translateZ(${d / 2}px)`, colors.front, front);
        face(w, h, `rotateY(180deg) translateZ(${d / 2}px)`, colors.side);
        face(d, h, `rotateY(90deg) translateZ(${w / 2}px)`, colors.side);
        face(d, h, `rotateY(-90deg) translateZ(${w / 2}px)`, colors.side);
        face(w, d, `rotateX(90deg) translateZ(${h / 2}px)`, colors.top);
        world.append(el);
        return el;
      };

      gsap.set("#t-table", { rotationX: 90 });

      // The kernel: the one piece that never changes.
      const kernel = box("t-kernel", 300, 140, 300, INK, " ");
      gsap.set(kernel, { x: 0, y: -70, z: 0 });

      // Pieces. Each docks against the kernel (or on it) with a gap of 14, and floats 300 away along its axis.
      // kind: "ships" (family colour), "own" (paper, outlined in ink, a band of the family's colour), "new" (a kind of
      // piece no family names yet: neutral).
      const FLOAT = 300, FAR = 1700;
      const pieces = {};
      const piece = (id, kind, family, size, at, axis) => {
        const svg = family ? `<svg viewBox="0 0 16 16"${kind === "own" ? ` style="fill:${HUE[family]}"` : ""}>${ICON[family]}</svg>` : " ";
        const colors = kind === "ships" ? shade(HUE[family]) : kind === "own" ? PAPER : NEUTRAL;
        const el = box("t-" + id, size[0], size[1], size[2], colors, kind === "own" ? `<span class="t-band" style="background:${HUE[family]}"></span>${svg}` : svg, kind === "own");
        const guide = document.createElement("div");
        guide.className = "t-guide";
        guide.id = "t-guide-" + id;
        world.append(guide);
        // The guide runs from the docked centre to the floating centre, along the piece's axis.
        const mid = [at[0] + axis[0] * FLOAT / 2, at[1] + axis[1] * FLOAT / 2, at[2] + axis[2] * FLOAT / 2];
        gsap.set(guide, { x: mid[0] - FLOAT / 2, y: mid[1], z: mid[2], width: FLOAT, transformOrigin: `${FLOAT / 2}px 0px`,
          rotationY: axis[2] ? 90 : 0, rotationZ: axis[1] ? 90 : 0 });
        pieces[id] = { el, guide, at, axis };
        place(id, FAR);
        gsap.set([el, guide], { visibility: "hidden" });
      };
      const offset = (id, k) => { const p = pieces[id]; return { x: p.at[0] + p.axis[0] * k, y: p.at[1] + p.axis[1] * k, z: p.at[2] + p.axis[2] * k }; };
      function place(id, k) { gsap.set(pieces[id].el, offset(id, k)); }

      // The first configuration: what ships.
      piece("gA", "ships", "graphics", [150, 240, 300], [239, -120, 0], [1, 0, 0]);
      piece("aA", "ships", "audio", [150, 140, 300], [-239, -70, 0], [-1, 0, 0]);
      piece("pA", "ships", "platform", [300, 90, 150], [0, -45, 239], [0, 0, 1]);
      piece("fA", "ships", "physics", [300, 190, 150], [0, -95, -239], [0, 0, -1]);
      piece("iA", "ships", "input", [140, 70, 140], [70, -189, 70], [0, -1, 0]);
      piece("tA", "ships", "tools", [140, 110, 140], [-70, -209, -70], [0, -1, 0]);
      // The second: other pieces of the same families, of other shapes, where three of the first were.
      piece("gB", "ships", "graphics", [150, 360, 140], [239, -180, -80], [1, 0, 0]);
      piece("aB", "ships", "audio", [150, 80, 300], [-239, -40, 0], [-1, 0, 0]);
      piece("tB", "ships", "tools", [300, 60, 140], [0, -184, -70], [0, -1, 0]);
      // The third: two pieces of your own, and one of a kind the first two configurations did not have.
      piece("oF", "own", "physics", [300, 120, 150], [0, -60, -239], [0, 0, -1]);
      piece("oI", "own", "input", [140, 100, 140], [70, -204, 70], [0, -1, 0]);
      piece("x1", "new", null, [300, 90, 150], [0, -45, 403], [0, 0, 1]);

      // The plane: a thin slab above the kernel with the face declared in the markup on its front.
      const slab = box("t-slab", 668, 388, 24, INK, " ");
      gsap.set(slab, { x: 0, y: -624, z: 0 });
      gsap.set("#t-plane-face", { x: -320, y: -804, z: 13 });
      const stem = document.createElement("div");
      stem.className = "t-guide";
      stem.id = "t-stem";
      world.append(stem);
      gsap.set(stem, { x: -145, y: -285, z: 0, width: 290, transformOrigin: "145px 0px", rotationZ: 90 });

      const tl = gsap.timeline({ paused: true });
      const show = (targets, at) => tl.set(targets, { visibility: "visible" }, at);
      const hide = (targets, at) => tl.set(targets, { visibility: "hidden" }, at);
      const move = (id, from, to, at, duration, ease) =>
        tl.fromTo(pieces[id].el, offset(id, from), { ...offset(id, to), duration, ease, immediateRender: false }, at);

      // A piece comes in from off the table and stops floating on its axis, the guide showing where it will dock.
      const arrive = (id, at) => { show(pieces[id].el, at); move(id, FAR, FLOAT, at, 0.7, "power3.out"); show(pieces[id].guide, at + 0.35); };
      // It docks, landing exactly at `at`; the kernel takes a small hit.
      const dock = (id, at) => {
        move(id, FLOAT, 0, at - 0.17, 0.17, "power2.in");
        hide(pieces[id].guide, at);
        tl.fromTo("#t-pivot", { scale: 1.012 }, { scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, at);
      };
      // The configuration comes apart: every piece springs back out along its own axis.
      const apart = (ids, at) => ids.forEach(id => { move(id, 0, FLOAT, at, 0.42, "back.out(1.6)"); show(pieces[id].guide, at + 0.2); });
      // A piece leaves the table.
      const leave = (id, at) => { hide(pieces[id].guide, at); move(id, FLOAT, FAR, at, 0.55, "power2.in"); hide(pieces[id].el, at + 0.55); };

      // What the configuration is for rises above it once everything has docked, and goes before anything is undone.
      const planeParts = "#t-slab, #t-plane-face, #t-stem";
      gsap.set(planeParts, { visibility: "hidden" });
      gsap.set("#t-yours", { visibility: "hidden" });
      const emerge = at => {
        show(planeParts, at);
        tl.fromTo("#t-slab, #t-plane-face", { scale: 0.001 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, at);
      };
      const retract = at => {
        tl.to("#t-slab, #t-plane-face", { scale: 0.001, duration: 0.25, ease: "power2.in" }, at);
        hide(planeParts, at + 0.25);
      };

      // One camera shot. Inside a shot the camera only drifts; a new configuration begins with a cut to a new angle.
      const shot = (from, to, target, a, b, ease) => {
        const o = { duration: to - from, ease: ease || "none", immediateRender: false };
        tl.fromTo("#t-pivot", { x: -target[0], y: -target[1], z: 0 }, { x: -target[0], y: -target[1], z: 0, ...o }, from);
        tl.fromTo("#t-dolly", { scale: a.zoom }, { scale: b.zoom, ...o }, from);
        tl.fromTo("#t-tilt", { rotationX: a.tilt }, { rotationX: b.tilt, ...o }, from);
        tl.fromTo("#t-yaw", { rotationY: a.yaw }, { rotationY: b.yaw, ...o }, from);
      };
      const line = (n, from, to) => {
        tl.fromTo("#t-line-" + n, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, from);
        tl.to("#t-line-" + n, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, to);
      };
      gsap.set(".t-line", { opacity: 0 });

      // 0-3.2 s (bars 0-1). The table, and the kernel set down on it.
      shot(0, 3.2, [0, -110], { zoom: 1.35, tilt: -30, yaw: -40 }, { zoom: 1.35, tilt: -30, yaw: -36 });
      // It is already coming down in the first frame and lands on the bar's third beat, with the first kick.
      tl.fromTo(kernel, { y: -430 }, { y: -70, duration: 0.8, ease: "power2.in" }, 0);
      tl.fromTo("#t-line-1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.to("#t-line-1", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 3.0);

      // 3.2-9.6 s (bars 2-5). Six pieces arrive, one every two beats, and float where they will dock.
      shot(3.2, 11.2, [0, -150], { zoom: 1.35, tilt: -30, yaw: -36 }, { zoom: 0.82, tilt: -30, yaw: -26 }, "power2.out");
      const first = ["gA", "aA", "pA", "fA", "iA", "tA"];
      first.forEach((id, i) => arrive(id, 3.2 + i * 0.8));
      line(2, 3.5, 9.4);

      // 10-11 s (bar 6). They dock, an eighth note apart.
      first.forEach((id, i) => dock(id, 10 + i * 0.2));

      // 11.2-19.2 s (bars 7-11). The first configuration runs: a game.
      shot(11.2, 20, [0, -330], { zoom: 0.82, tilt: -30, yaw: -26 }, { zoom: 0.82, tilt: -28, yaw: -14 });
      emerge(11.2);
      line(3, 11.7, 15.8);

      // 19.2-25.6 s (bars 12-15). The plane goes, the configuration comes apart, three pieces leave, three others come.
      retract(19.3);
      shot(20, 25.6, [0, -150], { zoom: 0.84, tilt: -34, yaw: 38 }, { zoom: 0.84, tilt: -34, yaw: 30 });
      apart(first, 20);
      line(4, 20.3, 23.2);
      ["gA", "aA", "tA"].forEach(id => leave(id, 20.9));
      arrive("gB", 21.6); arrive("aB", 22.4); arrive("tB", 23.2);
      const second = ["gB", "aB", "pA", "fA", "iA", "tB"];
      second.forEach((id, i) => dock(id, 24.4 + i * 0.2));

      // 25.6-33.6 s (bars 16-20). The second configuration runs: another game.
      shot(25.6, 34.4, [0, -330], { zoom: 0.82, tilt: -30, yaw: 30 }, { zoom: 0.82, tilt: -28, yaw: 18 });
      emerge(25.6);
      line(5, 26.1, 30.2);

      // 33.6-40 s (bars 21-24). Apart again; two pieces leave and two of your own come, with one of a new kind.
      retract(33.7);
      shot(34.4, 40, [0, -150], { zoom: 0.8, tilt: -40, yaw: -34 }, { zoom: 0.8, tilt: -40, yaw: -26 });
      apart(second, 34.4);
      ["fA", "iA"].forEach(id => leave(id, 35.2));
      arrive("oF", 36); arrive("oI", 36.8); arrive("x1", 37.6);
      line(6, 35.5, 39.7);
      dock("x1", 38.6);
      const third = ["gB", "aB", "pA", "oF", "oI", "tB"];
      third.forEach((id, i) => dock(id, 38.8 + i * 0.2));

      // 40-44.8 s (bars 25-27). The third configuration: the plane is empty, because that game is not ours to show.
      shot(40, 46.4, [0, -330], { zoom: 0.82, tilt: -30, yaw: -26 }, { zoom: 0.82, tilt: -28, yaw: -16 });
      show("#t-yours", 39.9);
      emerge(40);

      // 44.8-46.4 s (bar 28). Apart for the last time; every piece leaves the table, the kernel last.
      retract(44.9);
      apart([...third, "x1"], 45.2);
      [...third, "x1"].forEach(id => leave(id, 45.7));
      tl.to(kernel, { y: -1500, duration: 0.5, ease: "power2.in" }, 45.85);

      window.__timelines["table"] = tl;
    })();
  </script>
</template>
