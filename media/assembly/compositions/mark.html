<template>
  <style>
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('assets/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }

    #root { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }

    /* The last assembly: four ink pieces dock into the mark's board and the amber piece docks into it. Seen from the
       front and pressed flat it is the mark (site/src/components/brand/geometry.mjs on a 40 px unit: 640 x 480, the
       module 120 x 320 in the right socket), in the colours of the light lockup. */
    #mark-stage { position: absolute; inset: 0; perspective: 5200px; perspective-origin: 50% 48.15%; }
    #mark-cam, #mark-tilt, #mark-yaw, #mark-flat, #mark-fly, #mark-press, .mark-box { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
    #mark-cam { left: 960px; top: 520px; }
    .mark-face { position: absolute; backface-visibility: hidden; }

    /* The wordmark, placed where assets/brand/lockup-light.svg puts it beside a 138 px mark at (410, 444). */
    #mark-word { position: absolute; left: 588.89px; top: 430px; width: 921.11px; height: 147.5px; }
    #mark-word img { display: block; width: 100%; height: 100%; }
    #mark-line { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font: 400 44px/1.2 var(--font-body); color: var(--paper-ink-2); }
    .mark-w { display: inline-block; margin: 0 0.13em; }
  </style>

  <div id="root" data-composition-id="mark" data-width="1920" data-height="1080">
    <div id="mark-stage" data-layout-allow-overflow data-layout-ignore data-hold>
      <div id="mark-cam"><div id="mark-tilt"><div id="mark-yaw"><div id="mark-flat"></div><div id="mark-fly"><div id="mark-press"></div></div></div></div></div>
    </div>
    <div id="mark-word"><img src="assets/brand/wordmark-light.svg" alt="MicroEngine" /></div>
    <p id="mark-line"><span class="mark-w">One</span><span class="mark-w">kernel.</span><span class="mark-w">Assembled</span><span class="mark-w">your</span><span class="mark-w">way.</span></p>
  </div>

  <script>
    (() => {
      const flat = document.querySelector("#mark-flat");
      const box = (id, w, h, d, c, parent) => {
        const el = document.createElement("div");
        el.className = "mark-box";
        el.id = id;
        const face = (fw, fh, transform, color) => {
          const f = document.createElement("div");
          f.className = "mark-face";
          f.style.cssText = `width:${fw}px;height:${fh}px;left:${-fw / 2}px;top:${-fh / 2}px;transform:${transform};background:${color};`;
          el.append(f);
        };
        face(w, h, `translateZ(${d / 2}px)`, c.front);
        face(w, h, `rotateY(180deg) translateZ(${d / 2}px)`, c.side);
        face(d, h, `rotateY(90deg) translateZ(${w / 2}px)`, c.side);
        face(d, h, `rotateY(-90deg) translateZ(${w / 2}px)`, c.side);
        face(w, d, `rotateX(90deg) translateZ(${h / 2}px)`, c.top);
        face(w, d, `rotateX(-90deg) translateZ(${h / 2}px)`, c.side);
        (parent || flat).append(el);
        return el;
      };
      // The light lockup's colours: the board in ink, the module in the amber that reads on paper.
      const INK = { front: "#171b20", top: "#3a4048", side: "#0c0e11" };
      const AMBER = { front: "#dd9314", top: "#eeb655", side: "#a86f0d" };
      const D = 180;
      // Each part of the board, where it docks and the direction it comes from.
      const parts = [
        { el: box("mark-lintel", 640, 120, D, INK), at: [0, -180], from: [0, -700] },
        { el: box("mark-wall-0", 80, 360, D, INK), at: [-280, 60], from: [-900, 60] },
        { el: box("mark-wall-1", 80, 360, D, INK), at: [0, 60], from: [0, 760] },
        { el: box("mark-wall-2", 80, 360, D, INK), at: [280, 60], from: [900, 60] },
      ];
      const module = box("mark-module", 120, 320, D - 40, AMBER, document.querySelector("#mark-press"));
      gsap.set(module, { x: 140, y: 80 });

      const tl = gsap.timeline({ paused: true });
      gsap.set("#mark-word", { clipPath: "inset(0% 100% 0% 0%)" });
      gsap.set(".mark-w", { opacity: 0 });
      gsap.set("#mark-fly", { visibility: "hidden" });

      // 0.4-1.0 s (bar 29): the four parts of the board dock, an eighth note apart, seen from the table's angle.
      parts.forEach((part, i) => {
        tl.fromTo(part.el, { x: part.from[0], y: part.from[1], z: 0 }, { x: part.at[0], y: part.at[1], z: 0, duration: 0.3, ease: "power2.in" }, 0.1 + i * 0.2);
      });
      // The camera comes round to the front and the depth presses out: it was the mark being assembled.
      tl.fromTo("#mark-yaw", { rotationY: -34 }, { rotationY: 0, duration: 0.7, ease: "power2.inOut" }, 0.75);
      tl.fromTo("#mark-tilt", { rotationX: -26 }, { rotationX: 0, duration: 0.7, ease: "power2.inOut" }, 0.75);
      const depth = { board: 1, module: 1 };
      const press = () => {
        flat.style.transform = `scale3d(1, 1, ${depth.board})`;
        document.querySelector("#mark-press").style.transform = `scale3d(1, 1, ${depth.module})`;
      };
      tl.fromTo(depth, { board: 1 }, { board: 0.0001, duration: 0.35, ease: "power2.in", onUpdate: press }, 1.1);
      tl.set("#mark-flat .mark-face:not(:first-child)", { visibility: "hidden" }, 1.45);

      // 1.6 s (bar 30): the amber piece comes from the viewer's side and docks on the downbeat. The one heavy hit.
      tl.set("#mark-fly", { visibility: "visible" }, 1.3);
      tl.fromTo("#mark-fly", { z: 2600 }, { z: 0, duration: 0.3, ease: "power3.in", immediateRender: false }, 1.3);
      tl.fromTo(depth, { module: 1 }, { module: 0.0001, duration: 0.16, ease: "power2.in", onUpdate: press, immediateRender: false }, 1.44);
      tl.set("#mark-press .mark-face:not(:first-child)", { visibility: "hidden" }, 1.6);
      tl.fromTo("#mark-cam", { y: -16 }, { y: 0, duration: 0.5, ease: "elastic.out(1, 0.55)", immediateRender: false }, 1.6);

      // 2.3-3.2 s: the mark takes its place in the lockup while the wordmark wipes in beside it.
      tl.fromTo("#mark-cam", { x: 0, y: 0, scale: 1 }, { x: -481, y: -24, scale: 138.09 / 640, duration: 0.9, ease: "power3.inOut", immediateRender: false }, 2.3);
      tl.to("#mark-word", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.out" }, 2.75);

      // 3.9 s: the last line, word by word, then everything holds.
      tl.fromTo(".mark-w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.07 }, 3.9);

      press();
      window.__timelines["mark"] = tl;
    })();
  </script>
</template>
