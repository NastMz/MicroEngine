<template>
  <style>
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('assets/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }

    #root { position: absolute; inset: 0; overflow: hidden; background: var(--graphite); }

    /* The same structure as the board, with two bays: seen from the front and pressed flat, it is the mark
       (site/src/components/brand/geometry.mjs on a 40 px unit: 640 x 480, the module 120 x 320 in the right bay). */
    #mark-stage { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 48.15%; }
    #mark-cam, #mark-tilt, #mark-yaw, #mark-flat, #mark-fly, #mark-press, .mark-box { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
    #mark-cam { left: 960px; top: 520px; }
    .mark-face { position: absolute; backface-visibility: hidden; }

    /* The wordmark, placed where assets/brand/lockup-dark.svg puts it beside a 138 px mark at (410, 444). */
    #mark-word { position: absolute; left: 588.89px; top: 430px; width: 921.11px; height: 147.5px; }
    #mark-word img { display: block; width: 100%; height: 100%; }
    #mark-line { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font: 400 44px/1.2 var(--font-body); color: var(--ink-2); }
    .mark-w { display: inline-block; margin: 0 0.13em; }
  </style>

  <div id="root" data-composition-id="mark" data-width="1920" data-height="1080">
    <div id="mark-stage" data-layout-allow-overflow data-layout-ignore data-hold>
      <div id="mark-cam"><div id="mark-tilt"><div id="mark-yaw"><div id="mark-flat"></div><div id="mark-fly"><div id="mark-press"></div></div></div></div></div>
    </div>
    <div id="mark-word"><img src="assets/brand/wordmark-dark.svg" alt="MicroEngine" /></div>
    <!-- From the mark's construction notes: the left socket stays empty. -->
    <p id="mark-line"><span class="mark-w">There</span><span class="mark-w">is</span><span class="mark-w">always</span><span class="mark-w">room</span><span class="mark-w">for</span><span class="mark-w">another</span><span class="mark-w">module</span></p>
  </div>

  <script>
    (() => {
      const flat = document.querySelector("#mark-flat");
      const box = (id, w, h, d, at, c, parent) => {
        const el = document.createElement("div");
        el.className = "mark-box";
        el.id = id;
        const face = (fw, fh, transform, color) => {
          const f = document.createElement("div");
          f.className = "mark-face";
          f.style.cssText = `width:${fw}px;height:${fh}px;left:${-fw / 2}px;top:${-fh / 2}px;transform:${transform};background:${color};`;
          el.append(f);
        };
        face(w, h, `translateZ(${d / 2}px)`, c.front);
        face(w, h, `rotateY(180deg) translateZ(${d / 2}px)`, c.back);
        face(d, h, `rotateY(90deg) translateZ(${w / 2}px)`, c.side);
        face(d, h, `rotateY(-90deg) translateZ(${w / 2}px)`, c.side);
        face(w, d, `rotateX(90deg) translateZ(${h / 2}px)`, c.top);
        face(w, d, `rotateX(-90deg) translateZ(${h / 2}px)`, c.back);
        (parent || flat).append(el);
        gsap.set(el, { x: at[0], y: at[1], z: at[2] });
        return el;
      };
      const INK = { front: "#f1eee9", top: "#fbfaf7", side: "#cfcbc3", back: "#b9b5ad" };
      const AMBER = { front: "#fbc044", top: "#fdd98a", side: "#c8962f", back: "#a67c27" };
      const D = 180;
      box("mark-lintel", 640, 120, D, [0, -180, 0], INK);
      box("mark-wall-0", 80, 360, D, [-280, 60, 0], INK);
      box("mark-wall-1", 80, 360, D, [0, 60, 0], INK);
      box("mark-wall-2", 80, 360, D, [280, 60, 0], INK);
      // The module stays outside the flattened group, so its flight toward the board keeps its depth.
      box("mark-module", 120, 320, D - 40, [140, 80, 0], AMBER, document.querySelector("#mark-press"));

      const tl = gsap.timeline({ paused: true });
      gsap.set("#mark-word", { clipPath: "inset(0% 100% 0% 0%)" });
      gsap.set(".mark-w", { opacity: 0 });
      gsap.set("#mark-fly", { visibility: "hidden" });

      // 0.15-1.2 s: the structure builds in space: the lintel, then its three walls.
      tl.fromTo("#mark-lintel", { scaleX: 0.001 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.15);
      [["#mark-wall-0", 0.6], ["#mark-wall-1", 0.72], ["#mark-wall-2", 0.84]].forEach(([wall, at]) =>
        tl.fromTo(wall, { scaleY: 0.001, y: -120 }, { scaleY: 1, y: 60, duration: 0.36, ease: "power3.out" }, at));

      // 0-1.7 s: the camera comes round to the front, and the structure presses flat: it was the mark all along.
      tl.fromTo("#mark-yaw", { rotationY: -40 }, { rotationY: 0, duration: 1.6, ease: "power2.inOut" }, 0.1);
      tl.fromTo("#mark-tilt", { rotationX: -20 }, { rotationX: 0, duration: 1.6, ease: "power2.inOut" }, 0.1);
      // Depth is pressed out with scale3d, set from the timeline: one value drives the board, one the module.
      const depth = { board: 1, module: 1 };
      const press = () => {
        flat.style.transform = `scale3d(1, 1, ${depth.board})`;
        document.querySelector("#mark-press").style.transform = `scale3d(1, 1, ${depth.module})`;
      };
      tl.fromTo(depth, { board: 1 }, { board: 0.0001, duration: 0.5, ease: "power2.in", onUpdate: press }, 1.2);

      // Once flat, only the front faces remain: the picture is exactly the mark.
      tl.set("#mark-flat .mark-face:not(:first-child)", { visibility: "hidden" }, 1.7);
      tl.set("#mark-press .mark-face:not(:first-child)", { visibility: "hidden" }, 2.0);

      // 2.0 s (bar 24): the module arrives from the viewer's side and seats on the downbeat. The one heavy hit.
      tl.set("#mark-fly", { visibility: "visible" }, 1.66);
      tl.fromTo("#mark-fly", { z: 2200 }, { z: 0, duration: 0.34, ease: "power3.in", immediateRender: false }, 1.66);
      tl.fromTo(depth, { module: 1 }, { module: 0.0001, duration: 0.2, ease: "power2.in", onUpdate: press, immediateRender: false }, 1.8);
      tl.fromTo("#mark-cam", { y: -16 }, { y: 0, duration: 0.5, ease: "elastic.out(1, 0.55)", immediateRender: false }, 2.0);

      // 2.7-3.6 s: the mark takes its place in the lockup while the wordmark wipes in beside it.
      tl.fromTo("#mark-cam", { x: 0, y: 0, scale: 1 }, { x: -481, y: -24, scale: 138.09 / 640, duration: 0.9, ease: "power3.inOut", immediateRender: false }, 2.7);
      tl.to("#mark-word", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.out" }, 3.15);

      // 4.3 s: the last line, word by word, then everything holds.
      tl.fromTo(".mark-w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.07 }, 4.3);

      window.__timelines["mark"] = tl;
    })();
  </script>
</template>
