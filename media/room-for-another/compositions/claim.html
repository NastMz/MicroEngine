<template>
  <style>
    @font-face { font-family: 'Bricolage Grotesque'; font-weight: 600; src: url('assets/fonts/bricolage-grotesque-latin-600-normal.woff2') format('woff2'); }

    #root { position: absolute; inset: 0; overflow: hidden; background: #f8f6f2; }
    #claim-copy { position: absolute; left: 160px; top: 196px; }
    .claim-line { display: block; height: 172px; font: 600 156px/172px var(--font-display); letter-spacing: -0.02em; color: var(--paper-ink); white-space: nowrap; }
    .claim-word { display: inline-block; margin-right: 0.22em; }
    #claim-key { position: relative; }
    /* The one accent of the scene: an amber bar seated under the word that carries the idea. */
    #claim-seat { position: absolute; left: 0; right: 0; bottom: 4px; height: 16px; background: var(--amber-on-paper); transform-origin: 0 50%; }
    #claim-rise { position: absolute; inset: 0; background: var(--graphite); transform-origin: 50% 100%; z-index: 10; }
  </style>

  <div id="root" data-composition-id="claim" data-width="1920" data-height="1080">
    <h2 id="claim-copy">
      <span class="claim-line claim-not"><span class="claim-word">Not</span><span class="claim-word">a</span><span class="claim-word">fixed</span><span class="claim-word">set</span></span>
      <span class="claim-line claim-not"><span class="claim-word">of</span><span class="claim-word">features.</span></span>
      <span class="claim-line claim-is"><span class="claim-word">An</span><span class="claim-word" id="claim-key">architecture<span id="claim-seat"></span></span></span>
      <span class="claim-line claim-is"><span class="claim-word">to</span><span class="claim-word">build</span><span class="claim-word">on.</span></span>
    </h2>
    <div id="claim-rise"></div>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const words = (sel, at) => tl.fromTo(sel + " .claim-word", { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out", stagger: 0.07 }, at);

      // Bar 20: what it is not. Bar 21: what it is, and the first sentence steps back.
      words(".claim-not", 0.02);
      words(".claim-is", 2);
      tl.to(".claim-not", { color: "#a9a59d", duration: 0.3, ease: "power2.out" }, 2);
      tl.fromTo("#claim-seat", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 2.5);

      // 5.4-6 s: graphite rises from the baseline and becomes the last scene's ground.
      tl.fromTo("#claim-rise", { scaleY: 0 }, { scaleY: 1, duration: 0.58, ease: "power2.inOut" }, 5.4);

      window.__timelines["claim"] = tl;
    })();
  </script>
</template>
