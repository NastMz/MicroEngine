# Platform workflow (docs/ci.md, "Platform workflow"): the checks that need macOS runners, an emulator or a simulator.
# None takes part in a deployment or a release: their failures are shown and diagnosed but block nothing. Each job
# writes what it proved, level by level, to the run summary (platforms/README.md, "Evidence levels").
#   macOS     headless and native .NET tests, the games on SDL (Metal) against the SDL reference; an OpenGL probe that
#             explains whether raylib can open a window, and raylib captures only when it can
#   Android   APKs on SDL for a code-first and a content game, played on an x86_64 emulator (captures, keys, touch
#             taps and drags at the controls' logged positions, scripted two-thumb play, lifecycle) and compared with
#             the SDL reference
#   iOS       the same two games on SDL (Metal) in the simulator (captures, audio device, lifecycle, scripted touch)
#   Web mobile the four web demos on emulated phones and tablets in Chrome, played with real multi-touch events
#             (web/tests/mobile.mjs)
# Android and iOS check Meadow Run and Neon Rift unless the games input lists others.
# Runs: manually (any ref, any subset of platforms), from validate.yml, and once a month on main to catch runner
# image and toolchain drift. Never on pull requests: emulators and simulators do not run automatically. A full run
# measured 9 Linux and 5 macOS billable minutes, about $0.36 (docs/evaluations/infra-1.md).
name: platforms

on:
  schedule:
    - cron: '0 6 1 * *' # the 1st of each month, on main
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to check (default the run's own commit)
        type: string
        default: ''
      macos:
        description: macOS (tests, OpenGL diagnosis)
        type: boolean
        default: true
      android:
        description: Android (emulator)
        type: boolean
        default: true
      ios:
        description: iOS (simulator)
        type: boolean
        default: true
      web-mobile:
        description: Web demos on emulated phones and tablets (real multi-touch in Chrome)
        type: boolean
        default: true
      games:
        description: Games for the Android and iOS jobs, as a JSON list (all four, or a subset)
        type: string
        default: '["MeadowRun", "NeonRift"]'
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to check (default the run's own commit)
        type: string
        default: ''
      macos:
        description: macOS (tests, OpenGL diagnosis)
        type: boolean
        default: true
      android:
        description: Android (emulator)
        type: boolean
        default: true
      ios:
        description: iOS (simulator)
        type: boolean
        default: true
      web-mobile:
        description: Web demos on emulated phones and tablets (real multi-touch in Chrome)
        type: boolean
        default: true
      games:
        description: Games for the Android and iOS jobs, as a JSON list (all four, or a subset)
        type: string
        default: '["MeadowRun", "NeonRift"]'

permissions:
  contents: read

concurrency:
  group: platforms-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  macos:
    name: macOS (SDL with Metal; raylib OpenGL diagnosis)
    if: github.event_name == 'schedule' || inputs.macos
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: dotnet build MicroEngine.slnx -c Release
      - name: .NET tests (headless; native audio device)
        # tests/MicroEngine.Desktop.Tests open windows from a test thread, which Cocoa forbids; SDL on macOS is checked
        # below by running the games themselves.
        run: |
          dotnet test MicroEngine.slnx -c Release --no-build --filter "TestCategory!=Native" --logger trx --results-directory test-results
          dotnet test tests/MicroEngine.Raylib.Tests -c Release --no-build --filter "TestCategory=Native" --logger trx --results-directory test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results ".NET tests on macOS"
      - name: Scripted captures on SDL (the default platform) against the macOS SDL reference
        run: node web/tests/desktop.mjs --backend sdl --jobs 3 --out sdl-captures --reference web/tests/reference/sdl-macos-arm64.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-sdl-captures
          path: sdl-captures/desktop
          retention-days: 7
      - name: OpenGL probe (raylib)
        id: probe
        run: |
          clang -fobjc-arc -Wno-deprecated-declarations platforms/macos/gl-probe.m -framework OpenGL -framework Metal -framework Foundation -o "$RUNNER_TEMP/gl-probe"
          "$RUNNER_TEMP/gl-probe" | tee probe.md | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q "^| GLFW's: accelerated required | .*context created" probe.md; then echo "window=yes" >> "$GITHUB_OUTPUT"; else echo "window=no" >> "$GITHUB_OUTPUT"; fi
      - name: Scripted captures on raylib (completeness and size against the Linux reference)
        if: steps.probe.outputs.window == 'yes'
        run: node web/tests/desktop.mjs --out native-captures --reference web/tests/reference/linux-x64.json --names-only | tee -a "$GITHUB_STEP_SUMMARY"
      - name: raylib captures not attempted
        if: steps.probe.outputs.window != 'yes'
        run: |
          echo "::notice::No accelerated OpenGL renderer on this runner, so GLFW (raylib) cannot create a window; raylib captures skipped (see the probe in the summary)."
          echo "raylib captures skipped: no accelerated OpenGL renderer (GLFW requires one)." >> "$GITHUB_STEP_SUMMARY"

  # One job per game, in parallel: Meadow Run is code-first, Neon Rift ships PNG, WAV and OGG content files.
  android:
    name: Android ${{ matrix.game }} (SDL; emulator)
    if: github.event_name == 'schedule' || inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(inputs.games || '["MeadowRun", "NeonRift"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - name: Pinned versions
        run: sed 's/[[:space:]]*#.*$//' platforms/android/toolchain.env | grep '=' >> "$GITHUB_ENV"
      # The emulator's data partition needs several GB the image does not leave free; remove toolchains this job never uses.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/julia* /usr/local/share/chromium
          df -h / | tail -1
      - name: Toolchain (android workload)
        run: |
          dotnet workload install android > /dev/null
          { echo "### Android toolchain"; echo; echo "- .NET $(dotnet --version), $(dotnet workload list | grep -E '^android ' | tr -s ' ')"; echo "- Java $(java -version 2>&1 | head -1)"; echo; } >> "$GITHUB_STEP_SUMMARY"
      # The APK is built as any game's: by `microengine package android` (a test build, signed with the debug key).
      - name: APK
        run: |
          dotnet run --project src/MicroEngine.Cli -c Release -- package android --project games/${{ matrix.game }}/${{ matrix.game }}.csproj --debug-key --out dist/android
          apk=$(ls dist/android/${{ matrix.game }}-*-android.apk)
          echo "- APK: $(basename "$apk"), $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Play on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          disk-size: 4G
          # The action runs each script line with sh, so the checks live in a bash script.
          script: |
            bash platforms/android/ci-play.sh android-checks ${{ matrix.game }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks-${{ matrix.game }}
          path: android-checks
          retention-days: 7

  ios:
    name: iOS ${{ matrix.game }} (SDL with Metal; simulator)
    if: github.event_name == 'schedule' || inputs.ios
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(inputs.games || '["MeadowRun", "NeonRift"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # The newest ios workload can require an Xcode the image does not have yet, so the job pins the SDK
      # (web/toolchain.env), the workload set and the Xcode it requires (platforms/ios/toolchain.env).
      - name: Pinned versions
        run: sed 's/[[:space:]]*#.*$//' web/toolchain.env platforms/ios/toolchain.env | grep '=' >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          echo "Xcode on the image: $(for app in /Applications/Xcode_*.app; do basename "$app"; done | paste -sd' ' -)"
          for candidate in /Applications/Xcode_"$IOS_XCODE".app /Applications/Xcode_"$IOS_XCODE".0.app; do
            [ -d "$candidate" ] && { sudo xcode-select -s "$candidate"; break; }
          done
          xcodebuild -version | paste -sd' ' -
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'web/toolchain.env', 'NuGet.config') }}
      - name: Toolchain (ios workload)
        run: |
          echo "{ \"sdk\": { \"version\": \"$DOTNET_SDK_VERSION\", \"rollForward\": \"disable\" } }" > global.json
          dotnet workload install ios --version "$IOS_WORKLOAD_SET" > /dev/null
      # If the pinned Xcode is not the one the ios pack asks for, the build names it; that Xcode is selected and the
      # build repeated (then update IOS_XCODE).
      - name: App for the simulator
        run: |
          package() { dotnet run --project src/MicroEngine.Cli -c Release -- package ios-simulator --project games/${{ matrix.game }}/${{ matrix.game }}.csproj --out dist/ios; }
          if ! package > ios-build.log 2>&1; then
            grep -E ' error |error :' ios-build.log | sort -u | head -20 || true
            need=$(grep -oE 'requires Xcode [0-9]+(.[0-9]+)+' ios-build.log | head -1 | cut -d' ' -f3 || true)
            [ -n "$need" ] || { tail -40 ios-build.log; exit 1; }
            echo "::warning::IOS_XCODE=$IOS_XCODE, but the ios workload requires Xcode $need; update platforms/ios/toolchain.env."
            xcode=; for candidate in /Applications/Xcode_"$need".app /Applications/Xcode_"$need".0.app; do [ -d "$candidate" ] && { xcode=$candidate; break; }; done
            [ -n "$xcode" ] || { echo "::error::The ios workload needs Xcode $need, which this image does not have."; exit 1; }
            sudo xcode-select -s "$xcode"
            package
          fi
          # The app is checked from the package itself, as a developer receives it.
          ditto -x -k dist/ios/${{ matrix.game }}-*-ios-simulator.zip dist/ios/extracted
          app=$(ls -d dist/ios/extracted/${{ matrix.game }}/*.app)
          echo "APP=$app" >> "$GITHUB_ENV"
          { echo "### iOS toolchain"; echo; echo "- .NET $(dotnet --version), $(dotnet workload list | grep -E '^ios ' | tr -s ' ')"
            echo "- $(xcodebuild -version | paste -sd' ' -)"
            echo "- App: $app, $(du -sh "$app" | cut -f1); Frameworks: $(find "$app/Frameworks" -mindepth 1 -maxdepth 1 -exec basename {} \; 2>/dev/null | paste -sd' ' - || echo none)"; echo; } >> "$GITHUB_STEP_SUMMARY"
      - name: Play in the simulator
        run: |
          status=0
          platforms/ios/simulator-checks.sh "$APP" ${{ matrix.game }} ios-checks/${{ matrix.game }} || status=1
          node web/tests/desktop.mjs --skip-run --games ${{ matrix.game }} --out ios-checks/${{ matrix.game }} --reference web/tests/reference/sdl-ios-simulator-arm64.json | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-checks-${{ matrix.game }}
          path: ios-checks
          retention-days: 7

  web-mobile:
    name: Web demos on mobile (emulated devices, multi-touch)
    if: github.event_name == 'schedule' || inputs.web-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Toolchain folder
        run: echo "MICROENGINE_WEB_TOOLS=${{ runner.temp }}/web-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/web-tools
          key: web-tools-${{ runner.os }}-${{ hashFiles('web/toolchain.env', 'web/setup.sh', 'web/build-raylib-wasm.sh') }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/tests/package-lock.json
      - run: bash web/setup.sh
      - name: Development packages
        run: bash web/build.sh --dev --out dist/web-dev
      - run: npm ci --prefix web/tests
      - name: Touch on emulated phones and tablets
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          { echo "- $(google-chrome --version)"; echo; } >> "$GITHUB_STEP_SUMMARY"
          node web/tests/mobile.mjs --out web-mobile
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-mobile
          path: web-mobile
          retention-days: 7
