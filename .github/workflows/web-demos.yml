# Steps 1 and 2 of the site pipeline (docs/deployment.md): build the four web demo packages with the pinned
# toolchain and pack them into one versioned archive. A `demos-v<version>` tag also publishes the archive as a
# GitHub release asset, which the site build downloads and checks against site/demos.lock.json.
# Runs on Windows because web/setup.sh and web/build.sh were validated there (Git Bash).
name: web demos

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the archive (for example 0.1.0); a manual run does not publish a release
        required: true
  push:
    tags: ['demos-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      MICROENGINE_WEB_TOOLS: ${{ github.workspace }}/../web-tools
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = push ]; then v="${GITHUB_REF_NAME#demos-v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../web-tools
          key: web-tools-${{ hashFiles('web/toolchain.env', 'web/build-raylib-wasm.sh') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Toolchain (web/setup.sh)
        run: web/setup.sh

      - name: Build release packages (web/build.sh)
        run: web/build.sh

      - name: Pack
        run: |
          npm ci --prefix site
          node site/scripts/demos.mjs pack --version "${{ steps.version.outputs.version }}" --lock | tee pack.txt
          cp site/demos.lock.json dist/web-release/demos.lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: microengine-web-demos-${{ steps.version.outputs.version }}
          path: dist/web-release/*

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/web-release/microengine-web-demos-*.tar.gz dist/web-release/demos.lock.json \
            --title "Web demos ${{ steps.version.outputs.version }}" \
            --notes "Web packages of the four demos, built from $GITHUB_SHA. Pin them with the attached demos.lock.json (site/demos.lock.json)."
