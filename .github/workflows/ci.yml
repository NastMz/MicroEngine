# Daily CI (docs/ci.md): pull requests and pushes to main run the checks a change needs, once per content.
#   Plan       planner tests; changed paths decide the checks (.github/scripts/changes.mjs); evidence skips any check
#              that already passed for identical inputs (.github/scripts/evidence.mjs); demo keys say which package the
#              site uses (site/scripts/demos.mjs: the stored current one, else the released one). Daily CI never builds
#              a release web package: release.yml builds them, only for games whose inputs changed
#   checks     .NET on Linux, then Windows and native Linux; the site and its browser suites; the browser engine
#              suites (web/tests/run.mjs), development packages of the games a change reaches built and played
#              (.github/workflows/checks.yml)
#   sdk        the SDK packed, checked and used from outside the repository on Windows, Linux and macOS
#              (.github/workflows/sdk.yml), when a package input changed; never published from here
#   box2d      the Box2D natives built for every runtime identifier, self-tested and compared
#              (.github/workflows/box2d.yml), when the native layer, the physics or their tests changed
#   deploy     a preview for pull requests that change the site or a demo; production when main changes the
#              published site, always with the latest released demos: merging never publishes a demo. While
#              .github/phase-freeze exists, main deploys nothing (publication freeze, .github/scripts/freeze.mjs)
#   CI result  the one check to require: fails if anything needed failed, was cancelled or did not run (the SDK
#              check included); after it passes on main, sdk-release.yml starts if main documents a new SDK version
#   project graph  .NET tests and native captures are narrowed to the test projects and games that depend on the
#              changed files (.github/scripts/projects.mjs); a file outside every project runs them all
# macOS: headless tests, informative only, when the repository variable PUBLIC_RUNNERS is true (free public runners)
#          and MACOS_RUNNERS is not "off" (the switch that skips every macOS runner while GitHub has none to give);
#          like every check, skipped when evidence (check macos) shows they already passed for identical inputs.
# Never here: the Android emulator, the iOS simulator (validate.yml, platforms.yml), releases (release.yml).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.23.4 # site/package.json engines: Astro needs >= 22.23.4; a bare "22" takes whatever 22.x the runner caches

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # evidence of passed checks (artifacts)
    outputs:
      dotnet: ${{ steps.decide.outputs.dotnet }}
      windows: ${{ steps.decide.outputs.windows }}
      native: ${{ steps.decide.outputs.native }}
      sdk: ${{ steps.decide.outputs.sdk }}
      box2d: ${{ steps.decide.outputs.box2d }}
      macos: ${{ steps.decide.outputs.macos }}
      tests: ${{ steps.changes.outputs.tests }}
      games: ${{ steps.changes.outputs.games }}
      site: ${{ steps.decide.outputs.site }}
      suites: ${{ steps.decide.outputs.suites }}
      web-games: ${{ steps.decide.outputs.web-games }}
      keys: ${{ steps.decide.outputs.keys }}
      reused: ${{ steps.decide.outputs.reused }}
      deploy: ${{ steps.decide.outputs.deploy }}
      needed: ${{ steps.decide.outputs.needed }}
      fork: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Planner and release tool tests
        run: node --test .github/scripts/*.test.mjs packaging/*.test.mjs sdk/tests/version.test.mjs
      # Every active documentation reference names the documented SDK version (docs/releasing.md, "Versions").
      - name: SDK version references
        shell: bash # with pipefail, so `| tee` keeps a failure
        run: node sdk/version.mjs check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Checks for this change
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) args=(--base "$PR_BASE" --head HEAD) ;;
            *) args=(--base "$BEFORE" --head HEAD) ;;
          esac
          node .github/scripts/changes.mjs "${args[@]}" --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lint the workflows
        if: steps.changes.outputs.workflows == 'true'
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - run: npm ci --prefix site
      # Each game's key and the package the site would use: its current one when stored, else the released one. Nothing
      # is built here (--policy none): the browser engine suites play development packages of the games a change
      # reaches, and release.yml builds the release packages it publishes.
      - name: Demo packages
        id: demos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/scripts/demos.mjs plan --policy none --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Decide
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          DOTNET: ${{ steps.changes.outputs.dotnet }}
          WINDOWS: ${{ steps.changes.outputs.windows }}
          NATIVE: ${{ steps.changes.outputs.native }}
          SDK: ${{ steps.changes.outputs.sdk }}
          BOX2D: ${{ steps.changes.outputs.box2d }}
          MACOS: ${{ steps.changes.outputs.macos }}
          PUBLIC_RUNNERS: ${{ vars.PUBLIC_RUNNERS }}
          MACOS_RUNNERS: ${{ vars.MACOS_RUNNERS }}
          TESTS: ${{ steps.changes.outputs.tests }}
          GAMES: ${{ steps.changes.outputs.games }}
          WEB: ${{ steps.changes.outputs.web }}
          WEB_GAMES: ${{ steps.changes.outputs.web_games }}
          BROWSER: ${{ steps.changes.outputs.browser }}
          PACKAGES: ${{ steps.demos.outputs.packages }}
        run: |
          # The site and the web host need every suite; documentation needs the page layouts; otherwise no browser.
          if [ "$BROWSER" = full ]; then suites=layout,play,touch
          elif [ "$BROWSER" = layout ]; then suites=layout
          else suites=; fi
          site=$([ -n "$suites" ] && echo true || echo false)
          # The browser engine suites' games: the changed games, or every game of the scenarios.
          [ "$WEB_GAMES" = all ] && WEB_GAMES=$(node -e "console.log([...new Set(require('./web/tests/scenarios.json').scenarios.map(s => s.game))].join(','))")
          evidence=$(mktemp)
          GITHUB_OUTPUT="$evidence" node .github/scripts/evidence.mjs plan --checks dotnet,windows,macos,native,site,sdk,web,box2d \
            --extra "dotnet=tests=$TESTS" --extra "windows=tests=$TESTS" --extra "macos=tests=$TESTS" --extra "native=games=$GAMES" \
            --extra "web=games=$WEB_GAMES" --site-extra "suites=$suites $PACKAGES" --github-output | tee -a "$GITHUB_STEP_SUMMARY"
          get() { grep "^$1=" "$evidence" | cut -d= -f2-; }
          run() { [ "$1" = true ] && [ -z "$(get "reused_$2")" ] && echo true || echo false; }
          # macOS is informative and free only on a public repository's standard runners: never a gate, but its passes
          # are evidence like any other check's, so a merge does not repeat the tests its pull request passed.
          wants_macos=false; [ "$MACOS" = true ] && [ "$PUBLIC_RUNNERS" = true ] && [ "$MACOS_RUNNERS" != off ] && wants_macos=true
          # Production for a push that changes the published site, unless .github/phase-freeze exists (publication
          # freeze, docs/ci.md); a preview for a pull request that changes the site (freeze.mjs deployTarget).
          deploy=$(node .github/scripts/freeze.mjs deploy --event "$EVENT" --fork "$FORK" --browser "$BROWSER" 2>> "$GITHUB_STEP_SUMMARY")
          {
            echo "dotnet=$(run "$DOTNET" dotnet)"
            echo "windows=$(run "$WINDOWS" windows)"
            echo "native=$(run "$NATIVE" native)"
            echo "sdk=$(run "$SDK" sdk)"
            echo "box2d=$(run "$BOX2D" box2d)"
            echo "macos=$(run "$wants_macos" macos)"
            echo "site=$(run "$site" site)"
            echo "suites=$suites"
            echo "web-games=$([ "$(run "$WEB" web)" = true ] && node -e "console.log(JSON.stringify(process.argv[1].split(',').filter(Boolean)))" "$WEB_GAMES" || echo '[]')"
            echo "deploy=$deploy"
            echo "keys={\"dotnet\":\"$(get key_dotnet)\",\"windows\":\"$(get key_windows)\",\"macos\":\"$(get key_macos)\",\"native\":\"$(get key_native)\",\"site\":\"$(get key_site)\",\"sdk\":\"$(get key_sdk)\",\"web\":\"$(get key_web)\",\"box2d\":\"$(get key_box2d)\"}"
            echo "reused={\"dotnet\":\"$(get reused_dotnet)\",\"windows\":\"$(get reused_windows)\",\"macos\":\"$(get reused_macos)\",\"native\":\"$(get reused_native)\",\"site\":\"$(get reused_site)\",\"sdk\":\"$(get reused_sdk)\",\"web\":\"$(get reused_web)\",\"box2d\":\"$(get reused_box2d)\"}"
            # macos: wanted (informative); the CI result never gates on it.
            echo "needed={\"dotnet\":$DOTNET,\"windows\":$WINDOWS,\"macos\":$wants_macos,\"native\":$NATIVE,\"site\":$site,\"sdk\":$SDK,\"web\":$WEB,\"box2d\":$BOX2D}"
          } >> "$GITHUB_OUTPUT"
          echo "Deployment: $deploy" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    needs: plan
    uses: ./.github/workflows/checks.yml
    permissions:
      # The packaging jobs of checks.yml declare contents write (storing packages), and a caller must grant what a
      # called job declares even when that job is skipped; daily CI never runs them (build and native-packages stay
      # empty), so no job of this run writes to the repository.
      contents: write
    with:
      ref: ${{ github.sha }}
      dotnet: ${{ needs.plan.outputs.dotnet == 'true' }}
      windows: ${{ needs.plan.outputs.windows == 'true' }}
      native: ${{ needs.plan.outputs.native == 'true' }}
      macos: ${{ needs.plan.outputs.macos == 'true' }}
      tests: ${{ needs.plan.outputs.tests }}
      games: ${{ needs.plan.outputs.games }}
      site: ${{ needs.plan.outputs.site == 'true' }}
      demo-source: candidates
      suites: ${{ needs.plan.outputs.suites }}
      web-games: ${{ needs.plan.outputs.web-games }}
      # A fork's runs are never trusted as evidence (evidence.mjs ignores them), so they do not record any.
      evidence: ${{ needs.plan.outputs.fork != 'true' }}
      keys: ${{ needs.plan.outputs.keys }}

  # The SDK as an outside developer gets it; a separate reusable workflow because sdk-release.yml runs it too.
  sdk:
    name: SDK
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    uses: ./.github/workflows/sdk.yml
    with:
      ref: ${{ github.sha }}
      evidence: ${{ needs.plan.outputs.fork != 'true' }}
      key: ${{ fromJSON(needs.plan.outputs.keys).sdk }}
      # NativeAOT programs on Linux only; validate and a release also publish and run them on Windows.
      daily: true

  # The Box2D natives for every runtime identifier, tested and compared (sdk.yml packs the optional SDK package).
  box2d:
    name: Box2D
    needs: plan
    if: needs.plan.outputs.box2d == 'true'
    uses: ./.github/workflows/box2d.yml
    with:
      ref: ${{ github.sha }}
      # macOS and iOS natives need macOS runners: off with the switch that skips every macOS runner.
      apple: ${{ vars.MACOS_RUNNERS != 'off' }}
      evidence: ${{ needs.plan.outputs.fork != 'true' }}
      key: ${{ fromJSON(needs.plan.outputs.keys).box2d }}

  deploy:
    name: Site
    needs: [plan, checks]
    # Only after every needed check passed in this run or already passed for these inputs.
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.checks.result)
      && needs.plan.outputs.deploy != 'none'
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      ref: ${{ github.sha }}
      target: ${{ needs.plan.outputs.deploy }}
      demo-source: ${{ needs.plan.outputs.deploy == 'production' && 'release' || 'candidates' }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # The one required check (ruleset "main"): it passes only when every needed check passed here or already passed for
  # identical inputs, and the deployment (if any) succeeded.
  result:
    name: CI result
    needs: [plan, checks, sdk, box2d, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Summary
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          SDK: ${{ needs.sdk.result }}
          BOX2D: ${{ needs.box2d.result }}
          DEPLOY: ${{ needs.deploy.result }}
          WANTED: ${{ needs.plan.outputs.deploy }}
          NEEDED: ${{ needs.plan.outputs.needed }}
          REUSED: ${{ needs.plan.outputs.reused }}
          TESTS: ${{ needs.plan.outputs.tests }}
          GAMES: ${{ needs.plan.outputs.games }}
          MACOS: ${{ needs.plan.outputs.macos }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs
        run: |
          {
            echo "### CI result"; echo
            echo "| Check | Needed | Outcome |"; echo "| --- | --- | --- |"
            for check in dotnet windows native site sdk web box2d; do
              is_needed=$(echo "$NEEDED" | jq -r ".$check // false"); proof=$(echo "$REUSED" | jq -r ".$check // \"\"")
              if [ "$is_needed" != true ]; then outcome="not needed for this change"
              elif [ -n "$proof" ]; then outcome="already passed for identical inputs in [run $proof]($RUN_URL/$proof)"
              else outcome="ran here: $(case $check in sdk) echo "sdk $SDK" ;; box2d) echo "box2d $BOX2D" ;; *) echo "checks $CHECKS" ;; esac)"; fi
              echo "| $check | $is_needed | $outcome |"
            done
            echo; echo "Deployment: $WANTED ($DEPLOY). .NET tests: $TESTS; native captures: ${GAMES:-none}."
            macos_proof=$(echo "$REUSED" | jq -r '.macos // ""')
            if [ "$MACOS" = true ]; then echo "macOS ran as an informative check (see its job); it never gates."
            elif [ "$(echo "$NEEDED" | jq -r '.macos // false')" = true ] && [ -n "$macos_proof" ]; then
              echo "macOS (informative) already passed for identical inputs in [run $macos_proof]($RUN_URL/$macos_proof)."
            else echo "macOS, Android and iOS are not part of this run (validate.yml, platforms.yml)."; fi
            echo "Release web packages are never built here: release.yml builds them (docs/ci.md, \"Demo packages\")."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$PLAN" = success ] || { echo "::error::Plan $PLAN."; exit 1; }
          # Checks is skipped as a whole when the change needs none of its jobs (or evidence proved them all).
          [ "$CHECKS" = success ] || [ "$CHECKS" = skipped ] || { echo "::error::Checks $CHECKS."; exit 1; }
          [ "$SDK" = success ] || [ "$SDK" = skipped ] || { echo "::error::SDK $SDK."; exit 1; }
          [ "$BOX2D" = success ] || [ "$BOX2D" = skipped ] || { echo "::error::Box2D $BOX2D."; exit 1; }
          if [ "$WANTED" != none ] && [ "$DEPLOY" != success ]; then echo "::error::Deployment $DEPLOY."; exit 1; fi
      - uses: actions/checkout@v4
        if: always()
        with:
          sparse-checkout: .github/scripts
      - name: Cost of this run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-cost.mjs measure "$GITHUB_RUN_ID" --exclude "CI result" >> "$GITHUB_STEP_SUMMARY"
