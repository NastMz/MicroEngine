# The checks every other workflow composes (docs/ci.md): ci.yml runs the ones a change needs, validate.yml all of them
# for any ref, release.yml the demo builds and the site with the packages it is about to publish. Each job names its
# platform, so a failure says where it happened. Jobs never deploy anything.
#
# Evidence: when `evidence` is on, a job that passed uploads `evidence-<check>-<key>` (.github/scripts/evidence.mjs)
# as its last step, so a later run with identical inputs can skip it.
name: checks

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out
        type: string
        required: true
      dotnet:
        description: Headless .NET tests on Linux
        type: boolean
        default: false
      windows:
        description: The same tests on Windows (after Linux passed)
        type: boolean
        default: false
      macos:
        description: The same headless tests on macOS (after Linux passed); informative, never fails the checks
        type: boolean
        default: false
      tests:
        description: Test projects for the .NET jobs, from the project graph (projects.mjs) - all, a comma-separated
          list, or empty to only compile the solution
        type: string
        default: all
      games:
        description: Games whose scripted captures the native job compares - all, a comma-separated list, or empty
        type: string
        default: all
      native:
        description: SDL and raylib on Linux under Xvfb, native tests and scripted captures
        type: boolean
        default: false
      build:
        description: JSON list of games whose web package to build and store
        type: string
        default: '[]'
      site:
        description: Site unit tests and build, then the browser suites
        type: boolean
        default: false
      demo-source:
        description: DEMOS_SOURCE for the site build (keys, candidates, release); a draft release is not readable here
          (contents read), the release workflow verifies its draft itself
        type: string
        default: candidates
      suites:
        description: Browser suites (layout,play,touch), empty for none
        type: string
        default: ''
      evidence:
        description: Upload evidence of passed checks
        type: boolean
        default: false
      keys:
        description: 'JSON object of evidence keys: {"dotnet": "...", "windows": "...", "native": "...", "site": "...", "web": "..."}'
        type: string
        default: '{}'
      fork:
        description: A pull request from a fork (read-only token, untrusted code) keeps the packages it builds out of
          the shared store and hands them to the site job as workflow artifacts
        type: boolean
        default: false
      native-packages:
        description: 'JSON list of native packages to build, check and store: [{"game", "target", "runner"}] from
          `demos.mjs plan --native` (packaging/README.md). Never from a fork: storing needs contents write'
        type: string
        default: '[]'
      web-games:
        description: 'JSON list of games whose development web package the browser engine suites play in Chrome
          (web/tests/run.mjs), empty for none'
        type: string
        default: '[]'
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.4 # site/package.json engines: Astro needs >= 22.23.4; a bare "22" takes whatever 22.x the runner caches
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  # Fast tier: the engine and the four games' tests (headless simulation) on Linux, the cheapest runner. Native tests
  # (a real window, keyboard or sound server) are filtered out here and run in native-linux. Tests that only apply to
  # another system ([OSCondition]) are reported as skipped with their reason in the job summary, not as failures.
  dotnet-linux:
    name: .NET tests (Linux)
    if: inputs.dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - name: Tests (${{ inputs.tests }})
        run: .github/scripts/dotnet-test.sh "${{ inputs.tests }}" "TestCategory!=Native" test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results ".NET tests on Linux"
      # The API reference pages (docs/api) are generated from the engine's XML comments and committed; they must match.
      - name: API reference is up to date
        if: inputs.tests == 'all' || contains(inputs.tests, 'MicroEngine')
        run: dotnet tool restore && node site/scripts/api-reference.mjs --check
      # The documentation's samples, copied outside the repository and built with nuget.org only: what readers copy
      # works with the SDK version the documentation presents as published.
      - name: Documented samples build against the published SDK
        if: inputs.tests == 'all' || contains(inputs.tests, 'Samples.Tests')
        run: node sdk/tests/docs.mjs
      - if: inputs.evidence
        run: node .github/scripts/evidence.mjs record dotnet "${{ fromJSON(inputs.keys).dotnet }}" evidence.json
      - if: inputs.evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-dotnet-${{ fromJSON(inputs.keys).dotnet }}
          path: evidence.json
          retention-days: 30
          overwrite: true

  # Integration tier. Each job waits for the fast tier, so a broken change never occupies the Windows runner; a fast
  # tier that did not run (not needed, or already passed for these inputs) lets a job that is still needed start.
  dotnet-windows:
    name: .NET tests (Windows)
    needs: dotnet-linux
    if: >-
      !cancelled() && inputs.windows
      && contains(fromJSON('["success", "skipped"]'), needs.dotnet-linux.result)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - name: Tests (${{ inputs.tests }})
        shell: bash
        run: .github/scripts/dotnet-test.sh "${{ inputs.tests }}" "TestCategory!=Native" test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results ".NET tests on Windows"
      - if: inputs.evidence
        run: node .github/scripts/evidence.mjs record windows "${{ fromJSON(inputs.keys).windows }}" evidence.json
      - if: inputs.evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-windows-${{ fromJSON(inputs.keys).windows }}
          path: evidence.json
          retention-days: 30
          overwrite: true

  # Informative tier, only when the repository runs on free public runners (ci.yml, PUBLIC_RUNNERS): the headless tests
  # on macOS. macOS stays experimental (ADR 0012): a failure is reported, never a gate, and no evidence is recorded.
  dotnet-macos:
    name: .NET tests (macOS, informative)
    needs: dotnet-linux
    if: >-
      !cancelled() && inputs.macos
      && contains(fromJSON('["success", "skipped"]'), needs.dotnet-linux.result)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - name: Tests (${{ inputs.tests }})
        run: .github/scripts/dotnet-test.sh "${{ inputs.tests }}" "TestCategory!=Native" test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results ".NET tests on macOS (informative)"

  # The desktop backends for real on Linux: SDL and raylib with OpenGL (Mesa) in a virtual X display, the keyboard through the
  # X server, audio through a virtual PulseAudio sink, and the games' scripted runs compared with each backend's Linux reference.
  native-linux:
    name: Native Linux (SDL and raylib, Xvfb)
    needs: dotnet-linux
    if: >-
      !cancelled() && inputs.native
      && contains(fromJSON('["success", "skipped"]'), needs.dotnet-linux.result)
    runs-on: ubuntu-latest
    env:
      MICROENGINE_NATIVE_TESTS: '1'
      MICROENGINE_AUDIO_MONITOR: microengine.monitor
    defaults:
      run:
        shell: bash # with pipefail, so `| tee` keeps a failure
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - name: Virtual display and sound server
        run: |
          sudo apt-get update -q
          # libvulkan1 + mesa-vulkan-drivers: Mesa's software Vulkan (lavapipe) for the tier-1 SDL_GPU device.
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri libxtst6 pulseaudio pulseaudio-utils libvulkan1 mesa-vulkan-drivers vulkan-tools
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          # An idle null sink is suspended and its monitor goes quiet; keep it running for the recording test.
          pactl unload-module module-suspend-on-idle || true
          pactl load-module module-null-sink sink_name=microengine
          pactl set-default-sink microengine
      - run: dotnet build MicroEngine.slnx -c Release
      - name: Keyboard and audio (native tests)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" dotnet test tests/MicroEngine.Raylib.Tests -c Release --no-build --filter "TestCategory=Native" --logger trx --results-directory test-results
          xvfb-run -a -s "-screen 0 1920x1080x24" dotnet test tests/MicroEngine.Desktop.Tests -c Release --no-build --filter "TestCategory=Native&TestCategory!=Gpu" --logger trx --results-directory test-results
      # The tier-1 device (SDL_GPU) on Vulkan with only Mesa's software rasterizer installed: the device conformance
      # suite and the 3D tests. MICROENGINE_GPU_ADAPTER makes every device creation fail unless SDL_GPU reports the
      # lavapipe adapter ("llvmpipe ..."); the adapter and driver lines go to the job summary as the record of what ran.
      - name: Tier-1 graphics on SDL_GPU (Vulkan, Mesa lavapipe)
        env:
          MICROENGINE_GPU_ADAPTER: llvmpipe
        run: |
          # Only lavapipe: point the Vulkan loader at Mesa's software ICD (its file name differs between Mesa versions).
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          echo "Vulkan ICD: $icd" | tee -a gpu-tests.log
          export VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd"
          { vulkaninfo --summary 2>&1 || true; } | grep -E 'apiVersion|deviceType|deviceName|driverName|driverInfo' | tee -a gpu-tests.log || true
          xvfb-run -a -s "-screen 0 1920x1080x24" dotnet test tests/MicroEngine.Desktop.Tests -c Release --no-build --filter "TestCategory=Gpu" \
            --logger trx --logger "console;verbosity=detailed" --results-directory test-results | tee -a gpu-tests.log
          # The 3D slice sample on the same adapter: 45 deterministic frames, the last one captured (kept as an artifact).
          mkdir -p gpu-captures
          xvfb-run -a -s "-screen 0 1920x1080x24" dotnet samples/Slice3D/bin/Release/net10.0/Slice3D.dll --frames 45 --hidden \
            --capture gpu-captures/slice3d-lavapipe.png | tee -a gpu-tests.log
          { echo '### SDL_GPU adapter (lavapipe)'; echo; echo '```'; grep -m 4 -E 'deviceName|driverName' gpu-tests.log || true; grep -m 2 'sdl-gpu api=' gpu-tests.log || true; grep -m 1 'depth formats:' gpu-tests.log || true; grep -E '^(device|capture):' gpu-tests.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-captures
          path: gpu-captures
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results "Native tests on Linux"
      - name: Scripted captures against the Linux and SDL references (${{ inputs.games }})
        if: inputs.games != ''
        env:
          GAMES: ${{ inputs.games }}
        run: |
          only=(); [ "$GAMES" = all ] || only=(--games "$GAMES")
          xvfb-run -a -s "-screen 0 1920x1080x24" node web/tests/desktop.mjs --out native-captures --reference web/tests/reference/linux-x64.json "${only[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          # The default desktop platform, SDL (OpenGL on Mesa llvmpipe), against its Linux reference.
          xvfb-run -a -s "-screen 0 1920x1080x24" node web/tests/desktop.mjs --backend sdl --out native-captures/sdl --reference web/tests/reference/sdl-linux-x64.json "${only[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-captures
          path: native-captures
          retention-days: 7
      - if: inputs.evidence
        run: node .github/scripts/evidence.mjs record native "${{ fromJSON(inputs.keys).native }}" evidence.json
      - if: inputs.evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-native-${{ fromJSON(inputs.keys).native }}
          path: evidence.json
          retention-days: 30
          overwrite: true

  # SDL for the web (SDL3.a), cached by its sources and toolchain (.github/workflows/sdl-web.yml): the web jobs below
  # put it where web/setup.sh would build it, so none of them compiles SDL.
  sdl-web:
    name: SDL for the web
    if: inputs.build != '[]' || inputs.web-games != '[]'
    uses: ./.github/workflows/sdl-web.yml
    with:
      ref: ${{ inputs.ref }}

  # Web packages are built on Windows with the pinned toolchain and stored in the integration store under their
  # content key (site/scripts/demos.mjs). A key is built once; building never publishes a demo.
  build-demos:
    name: Build ${{ matrix.game }} (WebAssembly)
    needs: sdl-web
    if: inputs.build != '[]'
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(inputs.build) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # The toolchain lives outside the runner's user profile, so no profile path is compiled into a package.
      - name: Toolchain folder
        run: echo "MICROENGINE_WEB_TOOLS=$(cygpath -u '${{ runner.temp }}')/web-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/web-tools
          key: web-tools-${{ runner.os }}-${{ hashFiles('web/toolchain.env', 'web/setup.sh') }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - uses: actions/download-artifact@v4
        with:
          name: sdl-web-browser-wasm
          path: ${{ runner.temp }}/web-tools/sdl-web/browser-wasm
      - run: web/setup.sh
      - run: web/build.sh "${{ matrix.game }}"
      - name: Store the package
        if: ${{ !inputs.fork }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/scripts/demos.mjs publish "${{ matrix.game }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the package for this run only (fork pull request)
        if: inputs.fork
        env:
          DEMOS_STORE: dir:demo-overlay
        run: node site/scripts/demos.mjs publish "${{ matrix.game }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: inputs.fork
        uses: actions/upload-artifact@v4
        with:
          name: demo-package-${{ matrix.game }}
          path: demo-overlay
          retention-days: 3

  # Native packages (packaging/README.md): each one is built on its own system, checked as the file a player
  # downloads (structure, dependencies, then the game played by the package's executable against the target's SDL
  # reference) and only then stored under its content key. A stored package is never rebuilt; a release copies it.
  build-native:
    name: Package ${{ matrix.game }} for ${{ matrix.target }}
    if: inputs.native-packages != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.native-packages) }}
    defaults:
      run:
        shell: bash
    env:
      GAME: ${{ matrix.game }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.target }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - name: Virtual display and sound server (Linux)
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri pulseaudio pulseaudio-utils binutils
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=microengine
          pactl set-default-sink microengine
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: microsoft
          java-version: '21'
      - name: Android toolchain and signing key
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::No ANDROID_KEYSTORE_BASE64 secret: Android packages are signed with the release key only (packaging/README.md, \"Android signing\")."; exit 1; }
          sed 's/[[:space:]]*#.*$//' platforms/android/toolchain.env | grep '=' >> "$GITHUB_ENV"
          sudo rm -rf /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/julia* /usr/local/share/chromium
          dotnet workload install android > /dev/null
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build the package
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          file=$(node packaging/package.mjs "$GAME" --target "$TARGET" --out dist/packages | head -1)
          echo "PACKAGE=$file" >> "$GITHUB_ENV"
          echo "- Built \`$(basename "$file")\`, $(du -h "$file" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the package on ${{ matrix.target }}
        if: matrix.target != 'android'
        run: |
          # Hosted Windows runners have no sound device (audio is recorded there as not verified) and no GPU: Direct3D 11
          # runs on WARP, which rasterizes half-pixel and rotated sprites like other software renderers, so the runner
          # has its own reference (the GPU one is checked on real hardware, docs/evaluations/product-1.md).
          extra=(); [ "$TARGET" = windows-x64 ] && extra=(--audio optional --reference web/tests/reference/sdl-windows-ci.json)
          run=(); [ "$TARGET" = linux-x64 ] && run=(xvfb-run -a -s "-screen 0 1920x1080x24")
          "${run[@]}" node packaging/verify.mjs "$PACKAGE" --game "$GAME" --target "$TARGET" --record dist/verification.json --keep-captures dist/captures "${extra[@]}"
      - name: Linux distributions (Ubuntu 22.04, Debian 12, Fedora 41; Debian 11 must refuse)
        if: matrix.target == 'linux-x64'
        run: node packaging/linux-distros.mjs --packages dist/packages --out dist/linux-distros
      - name: Check the package on the emulator
        if: matrix.target == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          disk-size: 4G
          script: node packaging/verify.mjs "$PACKAGE" --game "$GAME" --target "$TARGET" --record dist/verification.json --keep-captures dist/captures
      - name: Store the checked package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/scripts/demos.mjs publish-native --file "$PACKAGE" --verification dist/verification.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.game }}-${{ matrix.target }}
          path: |
            dist/verification.json
            dist/captures
            dist/linux-distros
          retention-days: 7

  # The browser build's engine for real (web/tests/run.mjs), one job per game: a development package (SDL 3 in
  # WebAssembly) played in Chrome and Firefox on a virtual X server with a virtual sound server. Loading, starting by a
  # gesture, 60 updates per second whatever the page's frame rate, real key events (held, released, shorter than a
  # frame, focus loss, the scripts replayed through the keyboard), saves, the sound level reaching the output, a hidden
  # page's suspension, the games' scripts replayed to their end and twice (byte-identical captures), an emulated
  # gamepad, then touch on emulated phones and tablets (web/tests/mobile.mjs: multi-touch, safe-area insets): any
  # failure fails the job. Then the same scripts on the SDL desktop build under Mesa, whose captures are compared
  # byte for byte with the browser's and reported, and the package's size, start-up and frame time
  # (web/tests/measure.mjs), reported.
  browser-engine:
    name: Browser engine ${{ matrix.game }}
    needs: sdl-web
    if: inputs.web-games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(inputs.web-games) }}
    defaults:
      run:
        shell: bash # with pipefail, so `| tee` keeps a failure
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain folder
        run: echo "MICROENGINE_WEB_TOOLS=${{ runner.temp }}/web-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/web-tools
          key: web-tools-${{ runner.os }}-${{ hashFiles('web/toolchain.env', 'web/setup.sh') }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/tests/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - name: Virtual display and sound server
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri pulseaudio pulseaudio-utils
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=microengine
          pactl set-default-sink microengine
      - uses: actions/download-artifact@v4
        with:
          name: sdl-web-browser-wasm
          path: ${{ runner.temp }}/web-tools/sdl-web/browser-wasm
      - run: bash web/setup.sh
      - name: Development package
        run: bash web/build.sh --dev --out dist/web-dev "$GAME"
      - run: npm ci --prefix web/tests
      - name: Desktop build (the frames to compare with)
        run: dotnet build "games/$GAME/$GAME.csproj" -c Release
      - name: Chrome suites
        env:
          CHROME_PATH: /usr/bin/google-chrome
          # A headed Chrome refuses WebGL on Mesa's software GPU unless told otherwise; with this it draws with
          # llvmpipe, the renderer of the desktop build it is compared with.
          CHROME_FLAGS: --ignore-gpu-blocklist
        run: |
          { echo "### Browser engine: $GAME"; echo; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          xvfb-run -a -s "-screen 0 1920x1080x24" node web/tests/run.mjs platform scripts repeat keyboard framerate audio gamepad \
            --browsers chrome --games "$GAME" --headed --out web-tests | tee web-tests.log || status=$?
          grep -E '^(==|FAIL|[0-9]+ passed)' web-tests.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - name: Firefox suites
        if: ${{ !cancelled() }}
        run: |
          status=0
          firefox --version
          xvfb-run -a -s "-screen 0 1920x1080x24" node web/tests/run.mjs platform scripts repeat keyboard framerate audio gamepad \
            --browsers firefox --games "$GAME" --headed --out web-tests | tee web-tests-firefox.log || status=$?
          grep -E '^(==|FAIL|[0-9]+ passed)' web-tests-firefox.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - name: Emulated phones and tablets
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        # Headless, as the monthly mobile job runs it (platforms.yml); the script writes its table to the summary.
        run: node web/tests/mobile.mjs --games "$GAME" --out web-tests/mobile | tee web-mobile.log
      - name: Size, start-up and frame time (measured, not a gate)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CHROME_FLAGS: --ignore-gpu-blocklist
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node web/tests/measure.mjs --games "$GAME" --headed --out web-tests | tee -a "$GITHUB_STEP_SUMMARY"
      # Measured, not yet a gate: the browser and desktop builds of the same script do not produce the same frames in
      # every scene (the simulation drifts by a few pixels in some scrolling scenes), so a difference is reported in
      # the summary and kept as an artifact without failing the job.
      - name: Browser frames against the desktop build (measured, not a gate)
        id: frames
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node web/tests/desktop.mjs --out web-tests --games "$GAME" --backend sdl | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-engine-${{ matrix.game }}
          path: |
            web-tests
            web-tests*.log
            web-mobile.log
          retention-days: 7

  # One evidence for the browser engine suites, recorded only when every game's job passed.
  browser-engine-evidence:
    name: Browser engine evidence
    needs: browser-engine
    if: inputs.evidence && inputs.web-games != '[]' && needs.browser-engine.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .github/scripts
      - run: node .github/scripts/evidence.mjs record web "${{ fromJSON(inputs.keys).web }}" evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-web-${{ fromJSON(inputs.keys).web }}
          path: evidence.json
          retention-days: 30
          overwrite: true

  site:
    name: Site (Chrome and Firefox)
    # The site only needs the packages, not the .NET jobs.
    needs: build-demos
    if: >-
      !cancelled() && inputs.site
      && contains(fromJSON('["success", "skipped"]'), needs.build-demos.result)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - if: inputs.fork && inputs.build != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: demo-package-*
          merge-multiple: true
          path: site/demo-overlay
      - name: Build with ${{ inputs.demo-source }} demo packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEMOS_SOURCE: ${{ inputs.demo-source }}
          DEMOS_OVERLAY: ${{ inputs.fork && inputs.build != '[]' && 'demo-overlay' || '' }}
        run: npm run build
      # Firefox needs a display for WebGL without a GPU: run under a virtual X server (Mesa software rendering).
      - name: Browser checks (${{ inputs.suites }})
        if: inputs.suites != ''
        env:
          CHROME_PATH: /usr/bin/google-chrome
          HEADED: '1'
          BROWSERS: ${{ vars.BROWSER_CHECKS || 'chrome,firefox' }}
          SUITES: ${{ inputs.suites }}
        run: |
          command -v xvfb-run > /dev/null || sudo apt-get install -y xvfb
          xvfb-run -a node tests/browser.mjs --browsers "$BROWSERS" --suites "$SUITES"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: site/test-results
          retention-days: 7
      - if: inputs.evidence
        run: node ../.github/scripts/evidence.mjs record site "${{ fromJSON(inputs.keys).site }}" evidence.json
      - if: inputs.evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-site-${{ fromJSON(inputs.keys).site }}
          path: site/evidence.json
          retention-days: 30
          overwrite: true
