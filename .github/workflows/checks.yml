# The checks every other workflow composes (docs/ci.md): ci.yml runs the ones a change needs, validate.yml all of them
# for any ref, release.yml the demo builds and the site with the packages it is about to publish. Each job names its
# platform, so a failure says where it happened. Jobs never deploy anything.
#
# Evidence: when `evidence` is on, a job that passed uploads `evidence-<check>-<key>` (.github/scripts/evidence.mjs)
# as its last step, so a later run with identical inputs can skip it.
name: checks

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out
        type: string
        required: true
      dotnet:
        description: Headless .NET tests on Linux
        type: boolean
        default: false
      windows:
        description: The same tests on Windows (after Linux passed)
        type: boolean
        default: false
      native:
        description: raylib on Linux under Xvfb, native tests and scripted captures
        type: boolean
        default: false
      build:
        description: JSON list of games whose web package to build and store
        type: string
        default: '[]'
      site:
        description: Site unit tests and build, then the browser suites
        type: boolean
        default: false
      demo-source:
        description: DEMOS_SOURCE for the site build (keys, candidates, release); a draft release is not readable here
          (contents read), the release workflow verifies its draft itself
        type: string
        default: candidates
      suites:
        description: Browser suites (layout,play,touch), empty for none
        type: string
        default: ''
      evidence:
        description: Upload evidence of passed checks
        type: boolean
        default: false
      keys:
        description: 'JSON object of evidence keys: {"dotnet": "...", "windows": "...", "native": "...", "site": "..."}'
        type: string
        default: '{}'

permissions:
  contents: read

env:
  NODE_VERSION: 22
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  # Fast tier: the engine and the four games' tests (headless simulation) on Linux, the cheapest runner. Native tests
  # (a real window, keyboard or sound server) are filtered out here and run in native-linux. Tests that only apply to
  # another system ([OSCondition]) are reported as skipped with their reason in the job summary, not as failures.
  dotnet-linux:
    name: .NET tests (Linux)
    if: inputs.dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - run: dotnet test MicroEngine.slnx -c Release --filter "TestCategory!=Native" --logger trx --results-directory test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results ".NET tests on Linux"
      - if: inputs.evidence
        run: node .github/scripts/evidence.mjs record dotnet "${{ fromJSON(inputs.keys).dotnet }}" evidence.json
      - if: inputs.evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-dotnet-${{ fromJSON(inputs.keys).dotnet }}
          path: evidence.json
          retention-days: 30
          overwrite: true

  # Integration tier. Each job waits for the fast tier, so a broken change never occupies the Windows runner; a fast
  # tier that did not run (not needed, or already passed for these inputs) lets a job that is still needed start.
  dotnet-windows:
    name: .NET tests (Windows)
    needs: dotnet-linux
    if: >-
      !cancelled() && inputs.windows
      && contains(fromJSON('["success", "skipped"]'), needs.dotnet-linux.result)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - run: dotnet test MicroEngine.slnx -c Release --filter "TestCategory!=Native" --logger trx --results-directory test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results ".NET tests on Windows"
      - if: inputs.evidence
        run: node .github/scripts/evidence.mjs record windows "${{ fromJSON(inputs.keys).windows }}" evidence.json
      - if: inputs.evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-windows-${{ fromJSON(inputs.keys).windows }}
          path: evidence.json
          retention-days: 30
          overwrite: true

  # The desktop backend for real on Linux: raylib with OpenGL (Mesa) in a virtual X display, the keyboard through the
  # X server, audio through a virtual PulseAudio sink, and the games' scripted runs compared with the Linux reference.
  native-linux:
    name: Native Linux (raylib, Xvfb)
    needs: dotnet-linux
    if: >-
      !cancelled() && inputs.native
      && contains(fromJSON('["success", "skipped"]'), needs.dotnet-linux.result)
    runs-on: ubuntu-latest
    env:
      MICROENGINE_NATIVE_TESTS: '1'
      MICROENGINE_AUDIO_MONITOR: microengine.monitor
    defaults:
      run:
        shell: bash # with pipefail, so `| tee` keeps a failure
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - name: Virtual display and sound server
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri libxtst6 pulseaudio pulseaudio-utils
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          # An idle null sink is suspended and its monitor goes quiet; keep it running for the recording test.
          pactl unload-module module-suspend-on-idle || true
          pactl load-module module-null-sink sink_name=microengine
          pactl set-default-sink microengine
      - run: dotnet build MicroEngine.slnx -c Release
      - name: Keyboard and audio (native tests)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" dotnet test tests/MicroEngine.Raylib.Tests -c Release --no-build --filter "TestCategory=Native" --logger trx --results-directory test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results "Native tests on Linux"
      - name: Scripted captures against the Linux reference
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node web/tests/desktop.mjs --out native-captures --reference web/tests/reference/linux-x64.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-captures
          path: native-captures/desktop
          retention-days: 7
      - if: inputs.evidence
        run: node .github/scripts/evidence.mjs record native "${{ fromJSON(inputs.keys).native }}" evidence.json
      - if: inputs.evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-native-${{ fromJSON(inputs.keys).native }}
          path: evidence.json
          retention-days: 30
          overwrite: true

  # Web packages are built on Windows with the pinned toolchain and stored in the integration store under their
  # content key (site/scripts/demos.mjs). A key is built once; building never publishes a demo.
  build-demos:
    name: Build ${{ matrix.game }} (WebAssembly)
    if: inputs.build != '[]'
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(inputs.build) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # The toolchain lives outside the runner's user profile, so no profile path is compiled into a package.
      - name: Toolchain folder
        run: echo "MICROENGINE_WEB_TOOLS=$(cygpath -u '${{ runner.temp }}')/web-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/web-tools
          key: web-tools-${{ runner.os }}-${{ hashFiles('web/toolchain.env', 'web/setup.sh', 'web/build-raylib-wasm.sh') }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: web/setup.sh
      - run: web/build.sh "${{ matrix.game }}"
      - name: Store the package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/scripts/demos.mjs publish "${{ matrix.game }}" | tee -a "$GITHUB_STEP_SUMMARY"

  site:
    name: Site (Chrome and Firefox)
    # The site only needs the packages, not the .NET jobs.
    needs: build-demos
    if: >-
      !cancelled() && inputs.site
      && contains(fromJSON('["success", "skipped"]'), needs.build-demos.result)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build with ${{ inputs.demo-source }} demo packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEMOS_SOURCE: ${{ inputs.demo-source }}
        run: npm run build
      # Firefox needs a display for WebGL without a GPU: run under a virtual X server (Mesa software rendering).
      - name: Browser checks (${{ inputs.suites }})
        if: inputs.suites != ''
        env:
          CHROME_PATH: /usr/bin/google-chrome
          HEADED: '1'
          BROWSERS: ${{ vars.BROWSER_CHECKS || 'chrome,firefox' }}
          SUITES: ${{ inputs.suites }}
        run: |
          command -v xvfb-run > /dev/null || sudo apt-get install -y xvfb
          xvfb-run -a node tests/browser.mjs --browsers "$BROWSERS" --suites "$SUITES"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: site/test-results
          retention-days: 7
      - if: inputs.evidence
        run: node ../.github/scripts/evidence.mjs record site "${{ fromJSON(inputs.keys).site }}" evidence.json
      - if: inputs.evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-site-${{ fromJSON(inputs.keys).site }}
          path: site/evidence.json
          retention-days: 30
          overwrite: true
