# Checks the public site on every change to it or to the published Markdown: unit tests, then a full static build
# without demo packages (SITE_DEMOS=none), so documentation edits are validated without the WebAssembly toolchain.
name: site

on:
  pull_request:
    paths: ['site/**', 'docs/**', 'web/README.md', 'games/*/README.md', 'games/*/screenshots/**', 'samples/HelloEngine/**', 'README.md']
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'web/README.md', 'games/*/README.md', 'games/*/screenshots/**', 'samples/HelloEngine/**', 'README.md']

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_DEMOS: none
