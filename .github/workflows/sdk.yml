# The SDK as an outside developer gets it (docs/releasing.md, "How the SDK is checked"):
#   box2d     the Box2D natives for every runtime identifier (box2d-natives.yml, artifacts sdk-box2d-<rid>)
#   pack      every SDK package (dotnet pack MicroEngine.slnx), MicroEngine.Raylib with the web raylib, and
#             MicroEngine.Physics.Box2D with those natives; the feed is an artifact
#   external  sdk/tests/external.mjs on Windows, Linux and macOS: install microengine and the template from that feed into
#             a folder outside the repository, create, build, run and package a game, check expected failures
#   trimmed   sdk/tests/trimmed.mjs --aot beside the external project, on the same feed: a game with its own save types
#             and achievements published trimmed and with NativeAOT, and a game with a window published with NativeAOT;
#             every published executable is run and must do its work (saves read back, a scripted run that draws).
#             Linux in daily CI; Windows too in validate, a release and a manual run (docs/ci.md, "NativeAOT")
#   evidence  with `evidence` on, the run that passed records evidence-sdk-<key> (.github/scripts/evidence.mjs)
# Called by ci.yml when a package input changed (so the required CI result covers it, once per content) and by
# sdk-release.yml before a release, whose draft holds exactly this run's feed. It never publishes anything. No
# concurrency group of its own: its callers have theirs, and a shared group made one caller cancel the other.
name: sdk

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out
        type: string
        required: true
      evidence:
        description: Upload evidence of the passed check
        type: boolean
        default: false
      key:
        description: Evidence key of the sdk check (evidence.mjs plan)
        type: string
        default: ''
      release:
        description: A release pack, which must carry every Box2D runtime (macOS and iOS included)
        type: boolean
        default: false
      daily:
        description: Daily CI, which publishes the NativeAOT programs on Linux only (every other run adds Windows)
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.4 # site/package.json engines: Astro needs >= 22.23.4; a bare "22" takes whatever 22.x the runner caches
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # A release builds every runtime; other runs build macOS and iOS unless the switch for macOS runners is off, and
  # then pack without them.
  box2d:
    name: Box2D natives
    uses: ./.github/workflows/box2d-natives.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      apple: ${{ inputs.release || vars.MACOS_RUNNERS != 'off' }}
      prefix: sdk-box2d

  pack:
    name: Pack the SDK
    needs: box2d
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # SDL for browser builds (SDL3.a), compiled by the pinned web toolchain; MicroEngine.Sdl carries it and a release
      # pack (MicroEngineRelease) requires it. The key holds SDL's build inputs, so a cache hit already has it built.
      - name: Toolchain folder
        run: echo "MICROENGINE_WEB_TOOLS=${{ runner.temp }}/web-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/web-tools
          key: web-tools-${{ runner.os }}-${{ hashFiles('web/toolchain.env', 'web/setup.sh', 'src/MicroEngine.Sdl/native/sdl.env', 'src/MicroEngine.Sdl/native/build.sh') }}
      - run: bash web/setup.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-box2d-*
          path: box2d-natives
      - name: Box2D natives in place
        run: |
          mkdir -p artifacts/box2d
          for dir in box2d-natives/sdk-box2d-*; do cp -r "$dir" "artifacts/box2d/${dir#box2d-natives/sdk-box2d-}"; done
      - name: Pack
        id: pack
        env:
          ALL: ${{ inputs.release || vars.MACOS_RUNNERS != 'off' }}
        run: |
          dotnet pack MicroEngine.slnx -c Release -o sdk-feed -p:MicroEngineRelease=true
          # The optional Box2D package packs only when asked; every runtime built must be in it, all of them for a release.
          dotnet pack src/MicroEngine.Physics.Box2D -c Release -o sdk-feed -p:MicroEngineRelease=true             -p:MicroEngineBox2DPackage=true -p:MicroEngineBox2DRequireNatives="$ALL"
          version=$(sed -n 's:.*<MicroEngineVersion>\(.*\)</MicroEngineVersion>.*:\1:p' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node sdk/tests/packages.mjs sdk-feed | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-feed
          path: sdk-feed
          retention-days: 14

  external:
    name: External project (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The repository variable MACOS_RUNNERS=off drops the macOS project while GitHub has no macOS runner to give
        # (docs/ci.md): the check then covers Windows and Linux only.
        include: ${{ fromJSON(vars.MACOS_RUNNERS == 'off'
          && '[{"os":"Windows","runner":"windows-latest","targets":"windows,linux"},{"os":"Linux","runner":"ubuntu-latest","targets":"linux,web,android"}]'
          || '[{"os":"Windows","runner":"windows-latest","targets":"windows,linux"},{"os":"Linux","runner":"ubuntu-latest","targets":"linux,web,android"},{"os":"macOS","runner":"macos-latest","targets":"macos,linux"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # The external project lives outside the repository, so global.json does not choose its SDK: the newest installed
      # one builds it, as for a developer who installs the latest .NET. Installing that major here, instead of taking
      # whatever the runner image ships, keeps every runner on the same SDK while GitHub rolls out new images.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 11.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: sdk-feed
          path: sdk-feed
      - name: Workloads (the ones a developer installs for these targets)
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          # Workloads belong to one SDK: install them outside the repository, for the SDK the external project uses.
          # SDK 11 builds the net10.0 web host with wasm-tools-net10 (wasm-tools serves net11.0 only), as `microengine doctor web` says.
          (cd "$RUNNER_TEMP" && dotnet --version && dotnet workload install wasm-tools-net10 android > /dev/null)
          npm ci --prefix web/tests > /dev/null
      - uses: actions/setup-java@v4
        if: matrix.os == 'Linux'
        with:
          distribution: microsoft
          java-version: '21'
      - name: External project
        run: |
          run=(node sdk/tests/external.mjs --feed "$PWD/sdk-feed" --targets "${{ matrix.targets }}")
          # A display for the game's window (SDL's CPU renderer) on Linux.
          if [ "${{ matrix.os }}" = Linux ]; then xvfb-run -a "${run[@]}"; else "${run[@]}"; fi | tee external.log
          { echo "### External project on ${{ matrix.os }}"; echo '```'; grep -E '^(PASS|FAIL|skip)' external.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Trimmed and NativeAOT programs made from the feed, published and run (docs/ci.md, "NativeAOT"). A job beside the
  # external project, so it adds no time to the check; it packs nothing and needs no workload. Daily CI publishes on
  # Linux, the fastest runner to start; a release, validate and a manual run add Windows, whose NativeAOT programs are
  # linked by another toolchain (MSVC instead of clang) against another system's libraries.
  trimmed:
    name: Trimmed and NativeAOT (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.daily
          && '[{"os":"Linux","runner":"ubuntu-latest"}]'
          || '[{"os":"Linux","runner":"ubuntu-latest"},{"os":"Windows","runner":"windows-latest"}]') }}
    defaults:
      run:
        shell: bash # with pipefail, so `| tee` keeps a failure
    steps:
      # The script, global.json and Directory.Build.props (the version to ask the feed for); nothing else is read.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: sdk/tests
      # The projects live outside the repository: the newest installed SDK builds them, the one the external project uses.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: sdk-feed
          path: sdk-feed
      # NativeAOT links with the system's toolchain: clang and zlib on Linux (named here so that a runner image without
      # them fails in this step, not in the link); the Windows runner's Visual Studio C++ tools. Xvfb is the display of
      # the game with a window.
      - name: Native toolchain and a display
        if: matrix.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev xvfb > /dev/null
      # The script exits with 1 when any check fails: a publish with a warning, a link that fails, a published
      # executable that does not start, exits with an error, prints anything but the expected lines or draws nothing.
      - name: Publish and run (trimmed and NativeAOT)
        run: |
          run=(node sdk/tests/trimmed.mjs --feed "$PWD/sdk-feed" --aot)
          if [ "${{ matrix.os }}" = Linux ]; then run=(xvfb-run -a "${run[@]}"); fi
          status=0
          "${run[@]}" | tee trimmed.log || status=$?
          { echo "### Trimmed and NativeAOT programs on ${{ matrix.os }}"; echo '```'; grep -E '^(PASS|FAIL)' trimmed.log | cut -c1-200; tail -n 1 trimmed.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  evidence:
    name: Evidence
    needs: [pack, external, trimmed]
    if: inputs.evidence && inputs.key != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .github/scripts
      - run: node .github/scripts/evidence.mjs record sdk "${{ inputs.key }}" evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-sdk-${{ inputs.key }}
          path: evidence.json
          retention-days: 30
          overwrite: true
