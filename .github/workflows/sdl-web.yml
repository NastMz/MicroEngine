# SDL for the web: the static WebAssembly library (SDL3.a) the browser host links, SDL at the commit
# src/MicroEngine.Sdl/native/sdl.env pins, built by src/MicroEngine.Sdl/native/build.sh (which web/setup.sh runs the same
# way on a developer's machine) with the Emscripten of the .NET wasm-tools workload (web/setup.sh, cached like the other
# web jobs). checks.yml calls it before every job that builds a web package; it is also started by hand.
#   natives   cached by `build.sh key browser-wasm` (the inputs + the toolchain): a cache hit reuses the library; the
#             build checks that the archive defines what the engine calls; SHA256SUMS verified; uploaded as the
#             artifact sdl-web-browser-wasm (the web jobs put it where web/setup.sh would have built it)
# Nothing here publishes anything: the artifact expires.
name: sdl-web

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natives:
    name: SDL browser-wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Web toolchain location
        run: echo "MICROENGINE_WEB_TOOLS=${{ runner.temp }}/web-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/web-tools
          key: web-tools-${{ runner.os }}-${{ hashFiles('web/toolchain.env', 'web/setup.sh', 'web/build-raylib-wasm.sh') }}
      - name: Web toolchain (without SDL, built below)
        run: bash web/setup.sh --no-sdl
      - name: Cache key
        id: key
        run: |
          key=$(src/MicroEngine.Sdl/native/build.sh key browser-wasm)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Cache key: \`$key\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        id: cache
        with:
          path: artifacts/sdl/browser-wasm
          key: ${{ steps.key.outputs.key }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: src/MicroEngine.Sdl/native/build.sh browser-wasm --work "$RUNNER_TEMP/sdl-work"
      - name: Checksums
        run: |
          cd artifacts/sdl/browser-wasm
          sha256sum -c SHA256SUMS
          grep -qx "key: ${{ steps.key.outputs.key }}" build.txt
          {
            echo "### SDL browser-wasm $([ '${{ steps.cache.outputs.cache-hit }}' = true ] && echo '(cached build)')"; echo
            echo '```'; cat build.txt; echo; cat SHA256SUMS; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sdl-web-browser-wasm
          path: artifacts/sdl/browser-wasm
          retention-days: 30
