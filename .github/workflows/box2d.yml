# Box2D natives: the native library of MicroEngine.Physics.Box2D, Box2D at the commit
# src/MicroEngine.Physics.Box2D/native/box2d.env pins plus the me_box2d layer, built for every runtime identifier by
# src/MicroEngine.Physics.Box2D/native/build.sh (which developers run locally the same way) on a runner of that system.
# ci.yml calls it when the planner's box2d check is needed (.github/scripts/changes.mjs); it is also started by hand.
#   natives   one job per runtime identifier, cached by `build.sh key` (inputs + toolchain): a cache hit reuses the
#             build and the self-test output it made; SHA256SUMS verified; me_box2d_selftest run wherever the runner can
#             execute the result (desktop runners natively, browser-wasm under Node), build only for Android and iOS;
#             each runtime is uploaded as artifact box2d-<rid> (30 days)
#   compare   one table of every runtime's library checksums and self-test results, and the determinism promise: every
#             runtime that ran the self-test printed the same state hash, or the job fails
# macOS and iOS runtimes build only when `apple` is on (ci.yml passes the repository's runner switches); otherwise they
# are reported as not built. Nothing here publishes anything: the artifacts expire and no package is pushed.
name: box2d

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out
        type: string
        required: true
      apple:
        description: Also build osx-arm64, osx-x64 and ios-arm64 on macOS runners
        type: boolean
        default: true
      evidence:
        description: Upload evidence of the passed check
        type: boolean
        default: false
      key:
        description: The evidence key of the box2d check (.github/scripts/evidence.mjs)
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natives:
    name: Box2D ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          # The oldest supported Ubuntu runner: the library then needs glibc 2.35 or newer, not the newest runner's.
          - { rid: linux-x64, os: ubuntu-22.04 }
          - { rid: android-arm64, os: ubuntu-latest }
          - { rid: android-x64, os: ubuntu-latest }
          - { rid: browser-wasm, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest, apple: true }
          - { rid: osx-x64, os: macos-latest, apple: true }
          - { rid: ios-arm64, os: macos-latest, apple: true }
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
      SKIP: ${{ matrix.apple && github.event_name != 'workflow_dispatch' && !inputs.apple }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Not built on this run
        if: env.SKIP == 'true'
        run: |
          mkdir -p "artifacts/box2d/$RID"
          echo "not built: macOS runners are switched off for this run" > "artifacts/box2d/$RID/selftest.txt"
      - uses: actions/checkout@v4
        if: env.SKIP != 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Android NDK
        if: env.SKIP != 'true' && startsWith(matrix.rid, 'android-')
        run: |
          source src/MicroEngine.Physics.Box2D/native/box2d.env
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      # The emscripten .NET links browser builds with (web/setup.sh, cached like the other web jobs).
      - name: Web toolchain location
        if: env.SKIP != 'true' && matrix.rid == 'browser-wasm'
        run: echo "MICROENGINE_WEB_TOOLS=${{ runner.temp }}/web-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: env.SKIP != 'true' && matrix.rid == 'browser-wasm'
        with:
          path: ${{ runner.temp }}/web-tools
          key: web-tools-${{ runner.os }}-${{ hashFiles('web/toolchain.env', 'web/setup.sh', 'web/build-raylib-wasm.sh') }}
      - name: Web toolchain
        if: env.SKIP != 'true' && matrix.rid == 'browser-wasm'
        run: bash web/setup.sh
      - name: Cache key
        id: key
        if: env.SKIP != 'true'
        run: |
          key=$(src/MicroEngine.Physics.Box2D/native/build.sh key "$RID")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Cache key: \`$key\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        id: cache
        if: env.SKIP != 'true'
        with:
          path: artifacts/box2d/${{ matrix.rid }}
          key: ${{ steps.key.outputs.key }}
      - name: Build and self-test
        if: env.SKIP != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: src/MicroEngine.Physics.Box2D/native/build.sh "$RID" --work "$RUNNER_TEMP/box2d-work"
      - name: Checksums
        if: env.SKIP != 'true'
        run: |
          cd "artifacts/box2d/$RID"
          if command -v sha256sum > /dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          {
            echo "### Box2D $RID $([ '${{ steps.cache.outputs.cache-hit }}' = true ] && echo '(cached build)')"; echo
            echo '```'; cat build.txt; echo; cat SHA256SUMS; echo; tail -3 selftest.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ! grep -q '^FAIL' selftest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: box2d-${{ matrix.rid }}
          path: artifacts/box2d/${{ matrix.rid }}
          retention-days: 30

  compare:
    name: Box2D determinism
    needs: natives
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: box2d-*
          path: natives
      - name: Every runtime and the determinism promise
        env:
          NATIVES: ${{ needs.natives.result }}
        run: |
          {
            echo "### Box2D natives"; echo
            echo "| Runtime | Library (SHA-256) | Self-test | State hash |"; echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          hashes=()
          for dir in natives/box2d-*; do
            rid=${dir#natives/box2d-}
            sums=$( [ -f "$dir/SHA256SUMS" ] && awk '{ f = $2; sub(/^[*]/, "", f); printf "%s %s... ", f, substr($1, 1, 12) }' "$dir/SHA256SUMS" || echo 'not built')
            result=$(tail -1 "$dir/selftest.txt" 2>/dev/null || echo 'missing')
            hash=$(sed -n 's/^determinism \([0-9a-f]*\).*/\1/p' "$dir/selftest.txt" 2>/dev/null || true)
            [ -n "$hash" ] && hashes+=("$hash")
            echo "| $rid | $sums | $result | ${hash:--} |" >> "$GITHUB_STEP_SUMMARY"
          done
          distinct=$(printf '%s\n' "${hashes[@]}" | sort -u | wc -l)
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "${#hashes[@]}" -eq 0 ]; then echo "::error::No runtime ran the self-test."; exit 1; fi
          if [ "$distinct" -ne 1 ]; then echo "::error::The runtimes disagree on the state hash: the same Box2D build is not deterministic across them."; exit 1; fi
          echo "Determinism: ${#hashes[@]} runtimes ran the self-test, one state hash (${hashes[0]})." >> "$GITHUB_STEP_SUMMARY"
          [ "$NATIVES" = success ] || { echo "::error::A native build failed ($NATIVES)."; exit 1; }
      - uses: actions/checkout@v4
        if: inputs.evidence
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .github/scripts
      - if: inputs.evidence
        run: node .github/scripts/evidence.mjs record box2d "${{ inputs.key }}" evidence.json
      - if: inputs.evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-box2d-${{ inputs.key }}
          path: evidence.json
          retention-days: 30
          overwrite: true
