# MicroEngine's one pipeline (docs/deployment.md, "Pipeline"):
#   pull request   the checks this change needs, any demo whose inputs changed, the site, a protected preview
#   push to main   the same for what the merge changed, then deploys production: merging an approved pull request publishes it
#   manual run     every check, then a preview from any branch, or production from main
# Plan decides what runs (.github/scripts/changes.mjs, "What runs for a change" in docs/deployment.md), in three tiers:
#   fast           the planner's own tests and the headless .NET tests on Linux; every later .NET job waits for them
#   integration    .NET tests on Windows (and macOS, not blocking), raylib natively on Linux, demo builds, the browser
#   full           platforms.yml: macOS diagnosis, Android emulator and iOS simulator; never part of a deployment
# Demo packages are content-addressed (site/scripts/demos.mjs): each game's key hashes its inputs, so a package is
# built once on Windows with the pinned toolchain, stored as an asset of the private `demo-artifacts` prerelease, and
# reused until an input changes. The site is built by `vercel build` here and uploaded with `vercel deploy
# --prebuilt`: Vercel never builds from the repository, and a deployment exists only after every check passed.
name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment to create
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  VERCEL_CLI: vercel@64.3.1
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.demos.outputs.missing }}
      dotnet: ${{ steps.changes.outputs.dotnet }}
      macos: ${{ steps.changes.outputs.macos }}
      native: ${{ steps.changes.outputs.native }}
      # Rebuilt packages are always played in the browser, whatever the changed paths say.
      suites: >-
        ${{ (steps.changes.outputs.browser == 'full' || steps.demos.outputs.missing != '[]') && 'layout,play,touch'
        || steps.changes.outputs.browser == 'layout' && 'layout' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Planner tests
        run: node --test .github/scripts/*.test.mjs
      - name: Checks for this change
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) args=(--base "$PR_BASE" --head HEAD) ;;
            push) args=(--base "$BEFORE" --head HEAD) ;;
            *) args=(--all) ;;
          esac
          node .github/scripts/changes.mjs "${args[@]}" --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm ci --prefix site
      - name: Demo keys
        id: demos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/scripts/demos.mjs plan --github-output | tee -a "$GITHUB_STEP_SUMMARY"

  # Fast tier: the engine and the four games' tests (headless simulation) on Linux, the cheapest runner. Native tests
  # (a real window, keyboard or sound server) are filtered out here and run in native-linux. Tests that only apply to
  # another system ([OSCondition]) are reported as skipped with their reason in the job summary, not as failures.
  dotnet-linux:
    name: .NET tests (Linux)
    needs: plan
    if: needs.plan.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - run: dotnet test MicroEngine.slnx -c Release --filter "TestCategory!=Native" --logger trx --results-directory test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results ".NET tests on Linux"

  # Integration tier. Each job waits for the fast tier, so a broken change never occupies the Windows or macOS
  # runners; a skipped fast tier (nothing .NET changed) lets a job that is still needed run.
  dotnet-windows:
    name: .NET tests (Windows)
    needs: [plan, dotnet-linux]
    if: >-
      !cancelled() && needs.plan.outputs.dotnet == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.dotnet-linux.result)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - run: dotnet test MicroEngine.slnx -c Release --filter "TestCategory!=Native" --logger trx --results-directory test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results ".NET tests on Windows"

  # macOS is being evaluated: its results are recorded but never block a deployment (docs/guide/platforms.md). It runs
  # for engine and backend changes; a change to a game alone is managed code that Linux and Windows already ran.
  # Native rendering on macOS is diagnosed in platforms.yml: the hosted runner cannot open an OpenGL window.
  dotnet-macos:
    name: .NET tests (macOS, not blocking)
    needs: [plan, dotnet-linux]
    if: >-
      !cancelled() && needs.plan.outputs.macos == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.dotnet-linux.result)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - run: dotnet test MicroEngine.slnx -c Release --filter "TestCategory!=Native" --logger trx --results-directory test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results ".NET tests on macOS"

  # The desktop backend for real on Linux: raylib with OpenGL (Mesa) in a virtual X display, the keyboard through the
  # X server, audio through a virtual PulseAudio sink, and the games' scripted runs compared with the Linux reference.
  native-linux:
    name: Native Linux (raylib, Xvfb)
    needs: [plan, dotnet-linux]
    if: >-
      !cancelled() && needs.plan.outputs.native == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.dotnet-linux.result)
    runs-on: ubuntu-latest
    env:
      MICROENGINE_NATIVE_TESTS: '1'
      MICROENGINE_AUDIO_MONITOR: microengine.monitor
    defaults:
      run:
        shell: bash # with pipefail, so `| tee` keeps a failure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - name: Virtual display and sound server
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri libxtst6 pulseaudio pulseaudio-utils
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          # An idle null sink is suspended and its monitor goes quiet; keep it running for the recording test.
          pactl unload-module module-suspend-on-idle || true
          pactl load-module module-null-sink sink_name=microengine
          pactl set-default-sink microengine
      - run: dotnet build MicroEngine.slnx -c Release
      - name: Keyboard and audio (native tests)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" dotnet test tests/MicroEngine.Raylib.Tests -c Release --no-build --filter "TestCategory=Native" --logger trx --results-directory test-results
      - if: always()
        run: node .github/scripts/test-summary.mjs test-results "Native tests on Linux"
      - name: Scripted captures against the Linux reference
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node web/tests/desktop.mjs --out native-captures --reference web/tests/reference/linux-x64.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-captures
          path: native-captures/desktop
          retention-days: 7

  build-demos:
    name: Build ${{ matrix.game }}
    needs: plan
    if: needs.plan.outputs.missing != '[]'
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.plan.outputs.missing) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The toolchain lives outside the runner's user profile, so no profile path is compiled into a package.
      - name: Toolchain folder
        run: echo "MICROENGINE_WEB_TOOLS=$(cygpath -u '${{ runner.temp }}')/web-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/web-tools
          key: web-tools-${{ runner.os }}-${{ hashFiles('web/toolchain.env', 'web/setup.sh', 'web/build-raylib-wasm.sh') }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: web/setup.sh
      - run: web/build.sh "${{ matrix.game }}"
      - name: Store the package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/scripts/demos.mjs publish "${{ matrix.game }}" | tee -a "$GITHUB_STEP_SUMMARY"

  site:
    name: Site
    # The site does not wait for the .NET jobs: it only needs the packages. Deploy waits for everything.
    needs: [plan, build-demos]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.build-demos.result)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build with the stored demo packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      # Firefox needs a display for WebGL without a GPU: run under a virtual X server (Mesa software rendering).
      # Suites from Plan: `layout` (every page at three widths) for documentation, all of them when a package was
      # rebuilt or the web host or site changed, none when nothing published changed.
      - name: Browser checks (Chrome and Firefox)
        if: needs.plan.outputs.suites != ''
        env:
          CHROME_PATH: /usr/bin/google-chrome
          HEADED: '1'
          BROWSERS: ${{ vars.BROWSER_CHECKS || 'chrome,firefox' }}
          SUITES: ${{ needs.plan.outputs.suites }}
        run: |
          command -v xvfb-run > /dev/null || sudo apt-get install -y xvfb
          xvfb-run -a node tests/browser.mjs --browsers "$BROWSERS" --suites "$SUITES"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: site/test-results
          retention-days: 7

  deploy:
    name: Deploy
    needs: [site, dotnet-linux, dotnet-windows, native-linux]
    # !cancelled(): without it GitHub adds success(), so a check this change did not need (skipped) would skip the
    # deployment too. Each result is checked explicitly instead: skipped means not needed, anything else but success
    # stops the deployment. macOS and platforms.yml are not listed: they never block a deployment.
    # Pull requests from forks never get deployment credentials.
    if: >-
      !cancelled()
      && needs.site.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.dotnet-linux.result)
      && contains(fromJSON('["success", "skipped"]'), needs.dotnet-windows.result)
      && contains(fromJSON('["success", "skipped"]'), needs.native-linux.result)
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'push' || inputs.target == 'production') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ (github.event_name == 'push' || inputs.target == 'production') && 'production' || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      TARGET: ${{ (github.event_name == 'push' || inputs.target == 'production') && 'production' || 'preview' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - name: Production only from main
        if: env.TARGET == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deployments are made from main only."
          exit 1
      - name: Vercel configured?
        id: configured
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel is not configured (VERCEL_TOKEN secret, VERCEL_ORG_ID and VERCEL_PROJECT_ID variables); nothing deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Pull project settings
        if: steps.configured.outputs.ok == 'true'
        run: npx --yes "$VERCEL_CLI" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      # vercel build runs `npm ci` and `npm run build`: demo packages for this commit's keys, verified, then
      # check-dist. A missing or altered package fails here, before anything is uploaded.
      - name: Build
        if: steps.configured.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes "$VERCEL_CLI" build ${{ env.TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      - name: Deploy the prebuilt output
        id: deploy
        if: steps.configured.outputs.ok == 'true'
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt ${{ env.TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Link the preview on the pull request
        if: steps.configured.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview of $SHA: $URL"
