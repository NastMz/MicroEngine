# Box2D natives: the native library of MicroEngine.Physics.Box2D, Box2D at the commit
# src/MicroEngine.Physics.Box2D/native/box2d.env pins plus the me_box2d layer, built for every runtime identifier by
# src/MicroEngine.Physics.Box2D/native/build.sh (which developers run locally the same way) on a runner of that system,
# cached by `build.sh key` (inputs + toolchain): a cache hit reuses the build and the self-test output it made.
# SHA256SUMS verified; me_box2d_selftest run wherever the runner can execute the result (desktop runners natively,
# browser-wasm under Node), build only for Android and iOS. Each runtime is uploaded as artifact <prefix>-<rid>
# (30 days). Called by box2d.yml (the Box2D check, prefix box2d) and by sdk.yml (the SDK packs the
# MicroEngine.Physics.Box2D package with them, prefix sdk-box2d: one run of ci.yml can call both, and artifact names
# are unique per run). macOS and iOS runtimes build only when `apple` is on; otherwise they are reported as not built.
name: box2d-natives

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out
        type: string
        required: true
      apple:
        description: Also build osx-arm64, osx-x64 and ios-arm64 on macOS runners
        type: boolean
        default: true
      prefix:
        description: Artifact name prefix (<prefix>-<rid>)
        type: string
        default: box2d

permissions:
  contents: read

jobs:
  natives:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          # The oldest supported Ubuntu runner: the library then needs glibc 2.35 or newer, not the newest runner's.
          - { rid: linux-x64, os: ubuntu-22.04 }
          - { rid: android-arm64, os: ubuntu-latest }
          - { rid: android-x64, os: ubuntu-latest }
          - { rid: browser-wasm, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest, apple: true }
          - { rid: osx-x64, os: macos-latest, apple: true }
          - { rid: ios-arm64, os: macos-latest, apple: true }
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
      SKIP: ${{ matrix.apple && !inputs.apple }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Not built on this run
        if: env.SKIP == 'true'
        run: |
          mkdir -p "artifacts/box2d/$RID"
          echo "not built: macOS runners are switched off for this run" > "artifacts/box2d/$RID/selftest.txt"
      - uses: actions/checkout@v4
        if: env.SKIP != 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Android NDK
        if: env.SKIP != 'true' && startsWith(matrix.rid, 'android-')
        run: |
          source src/MicroEngine.Physics.Box2D/native/box2d.env
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      # The emscripten .NET links browser builds with (web/setup.sh, cached like the other web jobs).
      - name: Web toolchain location
        if: env.SKIP != 'true' && matrix.rid == 'browser-wasm'
        run: echo "MICROENGINE_WEB_TOOLS=${{ runner.temp }}/web-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: env.SKIP != 'true' && matrix.rid == 'browser-wasm'
        with:
          path: ${{ runner.temp }}/web-tools
          key: web-tools-${{ runner.os }}-${{ hashFiles('web/toolchain.env', 'web/setup.sh') }}
      - name: Web toolchain
        if: env.SKIP != 'true' && matrix.rid == 'browser-wasm'
        run: bash web/setup.sh --no-sdl
      - name: Cache key
        id: key
        if: env.SKIP != 'true'
        run: |
          key=$(src/MicroEngine.Physics.Box2D/native/build.sh key "$RID")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Cache key: \`$key\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        id: cache
        if: env.SKIP != 'true'
        with:
          path: artifacts/box2d/${{ matrix.rid }}
          key: ${{ steps.key.outputs.key }}
      - name: Build and self-test
        if: env.SKIP != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: src/MicroEngine.Physics.Box2D/native/build.sh "$RID" --work "$RUNNER_TEMP/box2d-work"
      - name: Checksums
        if: env.SKIP != 'true'
        run: |
          cd "artifacts/box2d/$RID"
          if command -v sha256sum > /dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          {
            echo "### Box2D $RID $([ '${{ steps.cache.outputs.cache-hit }}' = true ] && echo '(cached build)')"; echo
            echo '```'; cat build.txt; echo; cat SHA256SUMS; echo; tail -3 selftest.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ! grep -q '^FAIL' selftest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.prefix }}-${{ matrix.rid }}
          path: artifacts/box2d/${{ matrix.rid }}
          retention-days: 30
